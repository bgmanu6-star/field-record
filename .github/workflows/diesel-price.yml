name: Daily fuel price (Kanyakumari)

on:
  schedule:
    - cron: '35 1 * * *'   # 07:05 IST every day
    - cron: '35 5 * * *'   # 11:05 IST retry
  workflow_dispatch:        # "Run workflow" button for a manual update

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get today's diesel and petrol price
        run: |
          cat > /tmp/fuel_price.py <<'PYEOF'
          #!/usr/bin/env python3
          """Field Record - daily diesel & petrol price for Kanyakumari district.
          Run by GitHub Actions every morning. Reads the published daily rate from
          public fuel-price pages, cross-checks them, and writes price.json for the app.
          A fuel that can't be read reliably keeps its previous value."""
          import datetime, html, json, os, re, sys, urllib.request

          IST = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          NOW = datetime.datetime.now(IST)
          TODAY = NOW.date().isoformat()
          OUT = 'price.json'
          HEAD = {'User-Agent': 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Mobile Safari/537.36',
                  'Accept-Language': 'en-IN,en;q=0.9,hi;q=0.8'}
          NUM = r'([0-9]{2,3}\.[0-9]{1,2})'
          RS = r'(?:₹|Rs\.?|INR)\s*'
          FUELS = {
              'diesel': [
                  ('BusinessToday', 'https://www.businesstoday.in/fuel-price/diesel-price-in-kanniyakumari-today',
                   [r'Diesel price in Kanniyakumari (?:stands at|is)\s*' + RS + NUM]),
                  ('AajTak', 'https://www.aajtak.in/fuel-price/diesel-price-in-kanniyakumari-today',
                   [r'डी(?:ज़|ज़|ज)ल की कीमत\s*' + NUM, r'Diesel price in Kanniyakumari (?:stands at|is)\s*' + RS + NUM]),
                  ('BankBazaar', 'https://www.bankbazaar.com/fuel/diesel-price-kanyakumari.html',
                   [RS + NUM + r'\s*/\s*1\s*(?:ltr|litre)']),
              ],
              'petrol': [
                  ('BusinessToday', 'https://www.businesstoday.in/fuel-price/petrol-price-in-kanniyakumari-today',
                   [r'Petrol price in Kanniyakumari (?:stands at|is)\s*' + RS + NUM]),
                  ('AajTak', 'https://www.aajtak.in/fuel-price/petrol-price-in-kanniyakumari-today',
                   [r'पेट्रोल की कीमत\s*' + NUM, r'Petrol price in Kanniyakumari (?:stands at|is)\s*' + RS + NUM]),
                  ('BankBazaar', 'https://www.bankbazaar.com/fuel/petrol-price-kanyakumari.html',
                   [RS + NUM + r'\s*/\s*1\s*(?:ltr|litre)']),
              ],
          }

          def page_text(url):
              req = urllib.request.Request(url, headers=HEAD)
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read().decode('utf-8', 'ignore')
              no_js = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', raw)
              clean = lambda t: re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', t)))
              return clean(no_js), clean(raw)

          def find(texts, patterns):
              for t in texts:
                  for p in patterns:
                      m = re.search(p, t, re.I)
                      if m:
                          v = float(m.group(1))
                          if 70 <= v <= 150:
                              return round(v, 2)
              return None

          def get_fuel(fuel, sources, old):
              found = {}
              for name, url, pats in sources:
                  try:
                      v = find(page_text(url), pats)
                      print(f'{fuel} {name}: {v}')
                      if v:
                          found[name] = v
                  except Exception as e:
                      print(f'{fuel} {name}: error {e}')
              if not found:
                  return None
              names = list(found)
              for n in names:
                  same = [x for x in names if abs(found[x] - found[n]) <= 0.05]
                  if len(same) >= 2:
                      return {'price': found[n], 'date': TODAY, 'source': ' + '.join(same), 'confirmed': True, 'all_sources': found}
              price = found[names[0]]
              if old and old.get('price') and abs(price - float(old['price'])) > 5:
                  print(f'{fuel}: unconfirmed jump {old["price"]} -> {price}; keeping old')
                  return None
              return {'price': price, 'date': TODAY, 'source': names[0], 'confirmed': False, 'all_sources': found}

          def main():
              old = {}
              if os.path.exists(OUT):
                  try:
                      old = json.load(open(OUT, encoding='utf-8'))
                  except Exception:
                      old = {}
              old_d = old.get('diesel') or ({'price': old['price'], 'date': old.get('date'), 'source': old.get('source'), 'confirmed': old.get('confirmed')} if old.get('price') else None)
              old_p = old.get('petrol')
              d = get_fuel('diesel', FUELS['diesel'], old_d) or old_d
              p = get_fuel('petrol', FUELS['petrol'], old_p) or old_p
              if not d and not p:
                  print('No prices found - keeping previous price.json')
                  return 0
              hist = [h for h in old.get('history', []) if h.get('date') != TODAY]
              h = {'date': TODAY}
              if d and d.get('date') == TODAY: h['diesel'] = d['price']
              if p and p.get('date') == TODAY: h['petrol'] = p['price']
              if len(h) > 1: hist.append(h)
              data = {'area': 'Kanyakumari district', 'unit': 'INR per litre', 'updated': NOW.isoformat(timespec='minutes'),
                      'note': 'Reference retail prices from public fuel-price pages; actual pump rate can differ slightly by oil company.',
                      'diesel': d, 'petrol': p, 'history': hist[-120:]}
              if d:  # top-level diesel fields kept for older app versions
                  data.update({'price': d['price'], 'date': d['date'], 'source': d['source'], 'confirmed': d['confirmed']})
              if all(old.get(k) == data.get(k) for k in ('diesel', 'petrol')):
                  print('No change')
                  return 0
              with open(OUT, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=1)
              print('Saved', {k: (v or {}).get('price') for k, v in (('diesel', d), ('petrol', p))})
              return 0

          if __name__ == '__main__':
              sys.exit(main())
          PYEOF
          python3 /tmp/fuel_price.py
      - name: Save price.json
        run: |
          git config user.name "field-record-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --staged --quiet || (git commit -m "Fuel price $(TZ=Asia/Kolkata date +%F)" && git push)
