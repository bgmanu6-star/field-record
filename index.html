if(Array.isArray(S.operators)&&S.operators.length)OPS.splice(0,OPS.length,...S.operators);
if(!isNum(S.dieselPrice)||S.dieselPrice===101.8)S.dieselPrice=100.80;
if(!Array.isArray(S.priceHistory))S.priceHistory=[{price:100.80,from:'2026-01-01',user:''}];

if(!Array.isArray(S.petrolHistory))S.petrolHistory=[{price:108.68,from:'2026-01-01',user:''}];

const siteById=id=>S.sites.find(s=>s.id===id);
const activeSites=()=>S.sites.filter(s=>!s.hidden);
/* per-site settings, falling back to the global defaults */
function siteCfg(sid){const s=siteById(sid)||{};const n=(v,d)=>isNum(v)?+v:d;
  return {rate:n(s.rate,S.rate),opening:n(s.opening,S.openingDefault),tank:n(s.tank,0),low:n(s.low,S.lowFuel),
    method:s.method||'consumption',ops:Array.isArray(s.ops)&&s.ops.length?OPS.filter(o=>s.ops.includes(o)):OPS.slice(),wa:s.wa||S.waNumber||''}}
/* site list + per-site settings are shared with all phones through a 'config' record */
function applySiteConfig(rec){
  if(!rec||rec.type!=='config'||!Array.isArray(rec.data&&rec.data.sites))return false;
  if((S.sitesAt||0)>=(rec.updatedAt||0))return false;
  S.sites=rec.data.sites;S.sitesAt=rec.updatedAt||Date.now();
  if(Array.isArray(rec.data.operators)&&rec.data.operators.length){S.operators=rec.data.operators;OPS.splice(0,OPS.length,...rec.data.operators)}
  if(isNum(rec.data.dieselPrice))S.dieselPrice=+rec.data.dieselPrice;
  if(Array.isArray(rec.data.petrolHistory)){const autos=(S.petrolHistory||[]).filter(p=>p.auto&&!rec.data.petrolHistory.some(x=>x.from===p.from));S.petrolHistory=rec.data.petrolHistory.concat(autos)}
  if(rec.data.travel)S.travel=rec.data.travel;
  if(typeof rec.data.stockAutoFill==='boolean')S.stockAutoFill=rec.data.stockAutoFill;
  if(Array.isArray(rec.data.priceHistory)){const autos=(S.priceHistory||[]).filter(p=>p.auto&&!rec.data.priceHistory.some(x=>x.from===p.from));S.priceHistory=rec.data.priceHistory.concat(autos)}
  saveS();return true;
}
/* before adding a new operator for one site, pin the current list on sites that use "all operators" */
function freezeSiteOps(){S.sites.forEach(st=>{if(!Array.isArray(st.ops)||!st.ops.length)st.ops=OPS.slice()})}
const cleanName=t=>String(t||'').trim().replace(/[.#$\[\]\/<>"'`\\]/g,'').slice(0,30);
async function saveSiteConfig(){
  const rec={id:'config-sites',type:'config',site:'',siteName:'',dt:nowLocal(),user:S.user,createdAt:Date.now(),deleted:false,data:{sites:JSON.parse(JSON.stringify(S.sites)),operators:OPS.slice(),petrolHistory:S.petrolHistory,travel:S.travel||null,stockAutoFill:!!S.stockAutoFill,dieselPrice:S.dieselPrice,priceHistory:S.priceHistory},src:{}};
  await putRec(rec);S.sitesAt=rec.updatedAt;saveS();
}

/* ================= LOCAL DB (IndexedDB) ================= */
const DB={db:null,
open(){return new Promise((res,rej)=>{const r=indexedDB.open('fieldrecord',1);r.onupgradeneeded=()=>r.result.createObjectStore('records',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
all(){return new Promise(res=>{const q=this.db.transaction('records').objectStore('records').getAll();q.onsuccess=()=>res(q.result||[])})},
put(rec){return new Promise((res,rej)=>{const t=this.db.transaction('records','readwrite');t.objectStore('records').put(rec);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
del(ids){return new Promise((res,rej)=>{const t=this.db.transaction('records','readwrite');const st=t.objectStore('records');ids.forEach(id=>st.delete(id));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
let RECS=[];
const live=()=>RECS.filter(r=>!r.deleted&&r.type!=='config');
let PENDING=new Set(JSON.parse(localStorage.getItem('fr_pending')||'[]'));
const savePending=()=>localStorage.setItem('fr_pending',JSON.stringify([...PENDING]));
async function putRec(rec,{fromRemote=false}={}){
  if(!fromRemote){rec.updatedAt=Date.now();PENDING.add(rec.id);savePending()}
  await DB.put(rec);
  const i=RECS.findIndex(r=>r.id===rec.id);if(i>=0)RECS[i]=rec;else RECS.push(rec);
  if(!fromRemote){Sync.push()}
  else if(rec.type==='config'&&applySiteConfig(rec)&&!/^#\/(diesel|energy|request|stock|travel)\/|^#\/msg/.test(location.hash))setTimeout(route,0);
  status();
}

/* ================= DATA QUERIES ================= */
function recsOf(sid,type){return live().filter(r=>r.site===sid&&(!type||r.type===type)).sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:0)}
function fval(r,f){
  if(f==='fuel')return r.type==='diesel'&&isNum(r.data.closing)?+r.data.closing:undefined;
  const v=r.data[f];return isNum(v)?+v:undefined;
}
/* history of a field across diesel+energy records of a site */
function fieldHist(sid,f,{actualOnly=false}={}){
  const out=[];
  recsOf(sid).forEach(r=>{if(r.type!=='diesel'&&r.type!=='energy')return;const v=fval(r,f);if(v===undefined)return;const src=f==='fuel'?'CALC':(r.src||{})[f]||'MANUAL';if(actualOnly&&src==='EST')return;out.push({dt:r.dt,day:dayOf(r.dt),v,src,type:r.type})});
  return out;
}
function lastBefore(hist,day,inclusive){for(let i=hist.length-1;i>=0;i--){if(inclusive?hist[i].day<=day:hist[i].day<day)return hist[i]}return null}
function lastRecBefore(sid,type,day){const a=recsOf(sid,type).filter(r=>dayOf(r.dt)<day);return a[a.length-1]||null}
function sameDayRec(sid,type,day){return recsOf(sid,type).find(r=>dayOf(r.dt)===day)}

/* estimate a cumulative meter value at time dt from history */
function estimateField(sid,f,dt){
  let h=fieldHist(sid,f,{actualOnly:true}).filter(x=>x.dt<dt);
  if(!h.length)return null;
  const last=h[h.length-1];
  const win=h.filter(x=>daysBetween(x.dt,last.dt)<=120);
  const first=win[0];const span=daysBetween(first.dt,last.dt);
  const rate=span>=0.5?(last.v-first.v)/span:0;
  const el=Math.max(0,daysBetween(last.dt,dt));
  let est=last.v+rate*el;
  est=(f==='kwh'||f==='kvah')?Math.round(est):Math.round(est*10)/10;
  return {last,rate,elapsed:el,est,points:win.length};
}
function opHist(sid,op,ch,f){
  const out=[];recsOf(sid,'energy').forEach(r=>{const c=r.data.ops?.[op]?.[ch];if(!c||!isNum(c[f]))return;const src=(r.src||{})[`${op}.${ch}.${f}`]||'MANUAL';if(src==='EST')return;out.push({dt:r.dt,v:+c[f]})});return out;
}

/* signed-in Google account (cached so the app opens offline) */
let ACCOUNT=JSON.parse(localStorage.getItem('fr_account')||'null');
const Sync={ready:false,busy:false,err:'',unsub:null,loaded:false,
async load(){
  if(this.loaded)return;
  await loadScript(CDN.fbApp);await loadScript(CDN.fbAuth);await loadScript(CDN.fbStore);
  if(!firebase.apps.length)firebase.initializeApp(S.firebase);
  try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
  this.db=firebase.firestore();this.loaded=true;
},
async init(){
  if(!S.firebase){status();return}
  try{
    await this.load();
    if(this.watching)return;this.watching=true;
    firebase.auth().onAuthStateChanged(async u=>{
      if(u){
        const prevUid=localStorage.getItem('fr_uid');
        ACCOUNT={uid:u.uid,name:u.displayName||'',email:u.email||'',photo:u.photoURL||''};
        localStorage.setItem('fr_account',JSON.stringify(ACCOUNT));
        if(prevUid!==u.uid){await this.switchUser(prevUid,u);localStorage.setItem('fr_uid',u.uid)}
        if(!S.user){S.user=ACCOUNT.name;saveS()}
        if(!localStorage.getItem('fr_migrated_'+u.uid))await this.migrate(u);
        this.ready=true;this.err='';this.needLogin=false;this.listen();await this.push();
        if(location.hash==='#/login')location.hash='#/';else if(!/^#\/(diesel|energy|request|stock|travel)\/|^#\/msg/.test(location.hash))route();
      }else{
        this.ready=false;if(this.unsub){this.unsub();this.unsub=null}
        // keep the cached account so the app opens normally; just flag that sync needs a sign-in
        if(ACCOUNT)this.needLogin=true;else route();
      }
      status();
    });
  }catch(e){this.err=e.message||String(e);console.warn(e)}
  status();
},
/* every Google account has its own private data: users/{uid}/records */
col(){return this.db.collection('users').doc(firebase.auth().currentUser.uid).collection('records')},
async switchUser(prevUid,u){
  // keep only this user's data on the phone
  const keep=r=>prevUid?false:(r.id==='config-sites'||(r.email&&r.email===u.email)||(!r.email&&PENDING.has(r.id)&&!/^sample-/.test(r.id)));
  const drop=RECS.filter(r=>!keep(r)).map(r=>r.id);
  if(drop.length){await DB.del(drop);RECS=RECS.filter(r=>!drop.includes(r.id));drop.forEach(id=>PENDING.delete(id))}
  RECS.forEach(r=>PENDING.add(r.id));savePending();
  localStorage.setItem('fr_lastPull','0');
  if(prevUid){S.user=u.displayName||'';S.phone='';delete S.sitesAt;S.sites=DEFAULT_SITES.map((n,i)=>({id:'s'+(i+1),name:n}));OPS.splice(0,OPS.length,...DEFAULT_OPS);S.operators=OPS.slice();saveS()}
},
/* one-time move of this user's entries from the old shared collection */
async migrate(u){
  try{
    const old=await this.db.collection('records').where('email','==',u.email).get();
    let n=0;
    for(const d of old.docs){const r=d.data();if(!RECS.find(x=>x.id===r.id)){await DB.put(r);RECS.push(r);PENDING.add(r.id);n++}}
    if(!RECS.find(r=>r.id==='config-sites')){try{const c=await this.db.collection('records').doc('config-sites').get();if(c.exists){const r=c.data();await DB.put(r);RECS.push(r);PENDING.add(r.id);delete S.sitesAt;applySiteConfig(r);n++}}catch(e){}}
    savePending();localStorage.setItem('fr_migrated_'+u.uid,'1');
    if(n)toast(n+' earlier record(s) moved to your account');
  }catch(e){console.warn('migrate',e);if(!/permission/i.test(e.message))return;localStorage.setItem('fr_migrated_'+u.uid,'1')}
},
async login(){
  await this.load();
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  await firebase.auth().signInWithPopup(p);
},
async logout(){if(this.unsub){this.unsub();this.unsub=null}this.ready=false;if(this.loaded)await firebase.auth().signOut();ACCOUNT=null;localStorage.removeItem('fr_account');location.hash='#/login';route()},
listen(){
  if(this.unsub)this.unsub();
  const since=+localStorage.getItem('fr_lastPull')||0;
  this.unsub=this.col().where('updatedAt','>',since).onSnapshot(async snap=>{
    let changed=false,max=+localStorage.getItem('fr_lastPull')||0;
    for(const c of snap.docChanges()){
      const d=c.doc.data();max=Math.max(max,d.updatedAt||0);
      const loc=RECS.find(r=>r.id===d.id);
      if(PENDING.has(d.id)&&loc&&loc.updatedAt>=d.updatedAt)continue;
      if(!loc||(loc.updatedAt||0)<(d.updatedAt||0)){await putRec(d,{fromRemote:true});changed=true}
    }
    localStorage.setItem('fr_lastPull',max);
    if(changed&&!/^#\/(diesel|energy|request|stock|travel)\/|^#\/msg/.test(location.hash))route();
  },e=>{this.err=/permission/i.test(e.message)?'This Gmail ID is not allowed. Ask the admin to add it.':e.message;status();if(location.hash==='#/settings')Settings()});
},
async push(){
  if(!this.ready||!navigator.onLine||this.busy||!PENDING.size){status();return}
  this.busy=true;status();
  try{
    const ids=[...PENDING];
    for(let i=0;i<ids.length;i+=400){
      const b=this.db.batch();
      ids.slice(i,i+400).forEach(id=>{const r=RECS.find(x=>x.id===id);if(r)b.set(this.col().doc(id),r)});
      await b.commit();
      ids.slice(i,i+400).forEach(id=>PENDING.delete(id));savePending();
    }
    this.err='';
  }catch(e){this.err=e.message;console.warn(e)}
  this.busy=false;status();
},
async fullResync(){localStorage.setItem('fr_lastPull','0');RECS.forEach(r=>PENDING.add(r.id));savePending();if(this.ready){this.listen();await this.push()}}
};
window.addEventListener('online',()=>{Sync.ready?Sync.push():Sync.init();status()});
window.addEventListener('offline',status);
function status(){
  const el=$('#sync');if(!el)return;
  let h;
  if(Sync.busy)h='<div class="spin"></div>Syncing';
  else if(!navigator.onLine)h=`<span class="dot off"></span>Offline${PENDING.size?' · '+PENDING.size:''}`;

}

/* ================= OCR ================= */
let ocrWorker=null,ocrInit=null,ocrProg='';
const TESS_CORE='https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core-lstm.wasm.js';
function withTimeout(pr,ms,msg){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))])}
function ocrLog(m){
  if(m.status){const pct=m.progress?Math.round(m.progress*100):0;
    const label={'loading tesseract core':'Downloading OCR engine','initializing tesseract':'Starting OCR','loading language traineddata':'Downloading digit data','initializing api':'Preparing','recognizing text':'Reading digits'}[m.status]||m.status;
    ocrProg=`${label}${pct?` ${pct}%`:''}…`;const el=$('#ocrst');if(el)el.textContent=ocrProg;const bar=$('#ocrbar');if(bar)bar.style.width=(pct||5)+'%'}
}
function getWorker(){
  if(ocrWorker)return Promise.resolve(ocrWorker);
  if(ocrInit)return ocrInit;
  ocrInit=(async()=>{
    await loadScript(CDN.tess);
    // LSTM-only engine (oem 1) + non-SIMD core: smaller download, works on all iPhones/Android
    const w=await withTimeout(Tesseract.createWorker('eng',1,{corePath:TESS_CORE,logger:ocrLog}),120000,'OCR engine download timed out. Check internet and try again.');
    await w.setParameters({tessedit_char_whitelist:'0123456789.',tessedit_pageseg_mode:'7'});
    ocrWorker=w;return w;
  })().catch(e=>{ocrInit=null;throw e});
  return ocrInit;
}
/* warm up in background so the first scan is fast */
function preloadOCR(){if(navigator.onLine&&!ocrWorker&&!ocrInit&&!localStorage.getItem('fr_noocr'))setTimeout(()=>getWorker().catch(()=>{}),1500)}
function prepImage(file){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,1100/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    const orig=c.toDataURL('image/jpeg',.85);
    const d=x.getImageData(0,0,w,h),p=d.data;let sum=0;
    for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=p[i+1]=p[i+2]=g;sum+=g}
    const avg=sum/(p.length/4);const inv=avg<110;
    for(let i=0;i<p.length;i+=4){let g=p[i];if(inv)g=255-g;g=g<(inv?255-avg:avg)*0.85?0:255;p[i]=p[i+1]=p[i+2]=g}
    x.putImageData(d,0,0);res({orig,proc:c.toDataURL('image/png')});URL.revokeObjectURL(img.src)};
    img.onerror=()=>rej(new Error('Could not open the photo. Try again.'));img.src=URL.createObjectURL(file)});
}
function pickNumber(text){
  const m=(text||'').replace(/\s+/g,'').match(/\d+(\.\d+)?/g)||[];
  return m.sort((a,b)=>b.replace('.','').length-a.replace('.','').length)[0]||'';
}
/* opens camera; cb(value,target) */
function openOCR(title,cb,choices){
  const inp=$('#camIn');inp.value='';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;

    modal(`<h3>${esc(title)}</h3><div class="loader"><div class="spin"></div>Opening photo…</div>`);
    let orig,proc;
    try{({orig,proc}=await prepImage(f))}catch(e){return modal(`<h3>Camera</h3><div class="warn">${I.alert}${esc(e.message)}</div><button class="btn b-gr" onclick="closeModal()">Close</button>`)}
    const result=(v,msg)=>{
      if(done)return;done=true;
      $('#ocrl')&&$('#ocrl').remove();
      $('#ocrr').innerHTML=`<div class="lbl mt">Detected Reading</div>
        <input class="inp" id="ocrv" type="number" inputmode="decimal" step="any" value="${esc(v)}" placeholder="Type the reading from the photo">
        <div class="hint">${msg}</div>
        ${choices?`<div class="lbl mt">Apply to</div><div class="opts">${choices.map((c,i)=>`<button data-ch="${c}" class="${c===target?'on':''}">${c}</button>`).join('')}</div>`:''}
        <div class="btns"><button class="btn b-gr" id="ocrRe">${I.cam}Retake</button><button class="btn b-g" id="ocrUse">${I.ok}Use Reading</button></div>`;
      $$('[data-ch]').forEach(b=>b.onclick=()=>{$$('[data-ch]').forEach(x=>x.classList.remove('on'));b.classList.add('on');target=b.dataset.ch});
      $('#ocrRe').onclick=()=>{closeModal();openOCR(title,cb,choices)};
      $('#ocrUse').onclick=()=>{const val=$('#ocrv').value;if(!isNum(val))return toast('Enter a valid number');closeModal();cb(val,target)};
      if(!v)setTimeout(()=>$('#ocrv')&&$('#ocrv').focus(),100);
    };
    modal(`<h3>${esc(title)}</h3><img class="ocrimg" src="${orig}">
      <div id="ocrl" style="margin-top:12px"><div style="display:flex;align-items:center;gap:10px;color:var(--m);font-size:14px"><div class="spin" style="border-color:var(--gb);border-top-color:var(--g1);width:18px;height:18px"></div><span id="ocrst">${ocrWorker?'Reading digits…':(ocrProg||'Downloading OCR engine (first time only)…')}</span></div>
      <div style="height:6px;background:var(--gl);border-radius:4px;margin:10px 0;overflow:hidden"><div id="ocrbar" style="height:100%;width:5%;background:var(--g1);transition:width .3s"></div></div>
      <button class="btn b-gr" id="ocrSkip" style="width:100%">Type it myself</button></div><div id="ocrr"></div>`);
    $('#ocrSkip').onclick=()=>result('','Read the number from the photo above and type it.');
    try{
      const w=await getWorker();if(done)return;
      const st=$('#ocrst');if(st)st.textContent='Reading digits…';
      let r=await withTimeout(w.recognize(proc),40000,'Reading took too long.');let v=pickNumber(r.data.text);
      if(!v&&!done){r=await withTimeout(w.recognize(orig),40000,'Reading took too long.');v=pickNumber(r.data.text)}
      result(v,v?'Check the value against the photo and correct if needed.':'Could not read the digits clearly. Retake closer and straight, or type the value.');
    }catch(e){result('',esc(e.message||String(e))+' You can type the value from the photo.')}
  };
  inp.click();
}

/* ================= DIESEL FILLING PAGE ================= */
function DieselPage(sid){
  const site=siteById(sid);if(!site)return SiteList('diesel');preloadOCR();const SC=siteCfg(sid);
  const F={dt:nowLocal(),src:{},kwh:'',dg:'',piu:'',opening:'',filled:''};
  const prevInfo=()=>{
    const day=dayOf(F.dt);
    const prev=lastRecBefore(sid,'diesel',day);
    const kwhP=lastBefore(fieldHist(sid,'kwh'),day,false);
    return {prev,kwhP};
  };
  let P=prevInfo();
  F.opening=P.prev&&isNum(P.prev.data.closing)?+P.prev.data.closing:SC.opening;
  function hints(){
    P=prevInfo();
    $('#h-kwh').textContent=P.kwhP?`Previous: ${fmtN(P.kwhP.v)} on ${fmtD(P.kwhP.dt)}`:'No previous reading';
    $('#h-dg').textContent=P.prev&&isNum(P.prev.data.dg)?`Previous: ${fmtN(P.prev.data.dg)} on ${fmtD(P.prev.dt)}`:'No previous DG reading (first record)';
    $('#h-piu').textContent=P.prev&&isNum(P.prev.data.piu)?`Previous: ${fmtN(P.prev.data.piu)} on ${fmtD(P.prev.dt)}`:'No previous PIU reading';
    $('#pinfo').innerHTML=`<span>Previous Date</span><b>${P.prev?fmtD(P.prev.dt):'—'}</b><span>Last DG HMR</span><b>${P.prev?fmtN(P.prev.data.dg):'—'}</b><span>Last EB kWh</span><b>${P.kwhP?fmtN(P.kwhP.v):'—'}</b><span>Last PIU HMR</span><b>${P.prev?fmtN(P.prev.data.piu):'—'}</b><span>Last Fuel</span><b>${P.prev?fmtN(P.prev.data.closing,1)+' L':'—'}</b>`;
  }
  function calc(){
    const prevDg=P.prev&&isNum(P.prev.data.dg)?+P.prev.data.dg:null;
    const dgDiff=isNum(F.dg)&&prevDg!=null?r2(+F.dg-prevDg):0;
    const cons=r2(Math.max(0,dgDiff)*SC.rate);
    const closing=r2((+F.opening||0)+(+F.filled||0)-cons);
    return {prevDg,dgDiff,cons,closing};
  }
  function upd(){
    const c=calc();
    ['kwh','dg','piu'].forEach(k=>{const e=$('#e-'+k);e.textContent='';$('#f-'+k).classList.remove('bad')});

  const openHint=()=>{const p=P.prev,c=p&&isNum(p.data.closing)?+p.data.closing:null;$('#h-open').innerHTML=`<div class="l"><span>Previous closing balance${p?' ('+fmtD(p.dt)+')':''}</span><b style="color:${c==null?'var(--m)':c<0?'var(--r)':c>0?'var(--g1)':'var(--m)'}">${c==null?'— first record':(c>0?'+':c<0?'−':'')+fmtN(Math.abs(c),1)+' L'}</b></div><div class="hint" style="margin:2px 0 0">Opening = previous closing (or ${SC.opening} L for the first record). 0 and minus are allowed — edit if a dip shows otherwise.</div>`};

/* ================= DIESEL REQUEST ================= */
const RF=[['kwh','EB kWh'],['kvah','EB kVAh'],['dg','DG HMR'],['piu','PIU HMR'],['fuel','Fuel level']];
const reqDaysDefault=sid=>{const st=siteById(sid)||{};return isNum(st.reqDays)&&+st.reqDays>0?+st.reqDays:isNum(S.reqDays)&&+S.reqDays>0?+S.reqDays:30};
/* o.curDay = use readings on/before this date; o.prevDay = exact previous date; o.days = how many days back */
function buildSnapshot(sid,o={}){
  const H={};RF.forEach(([f])=>H[f]=fieldHist(sid,f));
  const cur={},prev={};
  RF.forEach(([f])=>{const h=H[f];const c=o.curDay?lastBefore(h,o.curDay,true):h[h.length-1];if(c)cur[f]=c});
  const curDays=['dg','fuel'].map(f=>cur[f]?.day).filter(Boolean);
  const curDay=o.curDay||(curDays.length?curDays.sort().pop():Object.values(cur).map(x=>x.day).sort().pop());
  if(!curDay)return null;
  const days=o.days||reqDaysDefault(sid);
  const target=o.prevDay||addDays(curDay,-days);let fallback=false;
  RF.forEach(([f])=>{let p=lastBefore(H[f],target,true);if(p&&p.day>=curDay)p=null;if(!p&&!o.prevDay){p=H[f].find(x=>x.day<curDay)||null;if(p)fallback=true}if(p)prev[f]=p});
  const prevDays=['dg','fuel'].map(f=>prev[f]?.day).filter(Boolean);
  const prevDay=prevDays.length?prevDays.sort().pop():Object.values(prev).map(x=>x.day).sort().pop()||'';
  const fills=recsOf(sid,'diesel').filter(r=>prevDay&&dayOf(r.dt)>prevDay&&dayOf(r.dt)<=curDay&&+r.data.filled>0);
  const filled=r2(fills.reduce((s,r)=>s+(+r.data.filled||0),0));
  return {curDay,prevDay,target,days,exactPrev:!!o.prevDay,fallback,filled,fills:fills.length,
    cur:Object.fromEntries(RF.map(([f])=>[f,cur[f]?{v:cur[f].v,src:cur[f].src}:{v:'',src:''}])),
    prev:Object.fromEntries(RF.map(([f])=>[f,prev[f]?{v:prev[f].v,src:prev[f].src}:{v:'',src:''}]))};
}
function reqCalc(R,sid){
  const SC=siteCfg(sid);
  const d=f=>isNum(R.cur[f].v)&&isNum(R.prev[f].v)?r2(R.cur[f].v-R.prev[f].v):'';
  const dg=d('dg');
  const fuelDiff=isNum(R.cur.fuel.v)&&isNum(R.prev.fuel.v)?r2(R.prev.fuel.v-R.cur.fuel.v):'';
  const cons=isNum(dg)?r2(Math.max(0,dg)*SC.rate):'';
  const tankUse=isNum(fuelDiff)?r2(fuelDiff+(+R.filled||0)):'';
  const tankFill=SC.tank&&isNum(R.cur.fuel.v)?r2(Math.max(0,SC.tank-R.cur.fuel.v)):'';
  let req=isNum(cons)&&isNum(R.cur.fuel.v)?r2(Math.max(0,cons-R.cur.fuel.v)):'';
  if(SC.method==='tank'&&isNum(tankFill))req=tankFill;
  else if(isNum(req)&&isNum(tankFill))req=Math.min(req,tankFill);
  return {kwh:d('kwh'),kvah:d('kvah'),dg,piu:d('piu'),fuelDiff,cons,tankUse,req,tankFill,rate:SC.rate,method:SC.method,tank:SC.tank};
}
function reqMessage(sid,R,C){
  const e=(o)=>o.src==='EST'?' (Est.)':'';
  const v=(o,dec=2)=>fmtN(o.v,dec)+e(o);
  const L=[];
  L.push(siteName(sid),'',`Current: ${fmtD(R.curDay)}`,`EB kWh: ${v(R.cur.kwh)}`,`EB kVAh: ${v(R.cur.kvah)}`,`DG HMR: ${v(R.cur.dg)}`,`PIU HMR: ${v(R.cur.piu)}`,`Fuel level: ${fmtN(R.cur.fuel.v,1)} Litres`,'',
    `Previous: ${fmtD(R.prevDay)}`,`EB kWh: ${v(R.prev.kwh)}`,`EB kVAh: ${v(R.prev.kvah)}`,`DG HMR: ${v(R.prev.dg)}`,`PIU HMR: ${v(R.prev.piu)}`,`Fuel level: ${fmtN(R.prev.fuel.v,1)} Litres`,'',
    'Consumption and Difference Summary',`EB kWh Consumption: ${fmtN(C.kwh)}`,`EB kVAh Consumption: ${fmtN(C.kvah)}`,`DG Running Hours: ${fmtN(C.dg)}`,`PIU Running Hours: ${fmtN(C.piu)}`,`Fuel Level Difference: ${fmtN(C.fuelDiff,1)} Litres`);
  if(+R.filled>0)L.push(`Diesel Filled in Period: ${fmtN(R.filled,1)} Litres`);
  L.push(`DG Diesel Consumption (${C.rate} L/Hr): ${fmtN(C.cons,1)} Litres`,`Diesel Requirement: ${fmtN(C.req,1)} Litres`,'','Kindly arrange the required diesel filling.');
  return L.join('\n');
}
let MSG=null;
function RequestPage(sid,o={}){
  const site=siteById(sid);if(!site)return SiteList('request');

/* ================= DIESEL STOCK MANAGEMENT ================= */
/* Independent module with THREE separate balances:
   1. Company allocation balance = Allocated − Purchased            (− = you bought more than allocated)
   2. Personally funded diesel    = Purchased − Allocated (if more)  (paid from your own money)
   3. Physical stock              = Balance set + Purchased + Received − Filled − Transferred out
      split into company-funded stock and personally-funded stock (fills use company diesel first). */
const SK={
  allocation:{l:'Allocated',s:'Allocated',hint:'Diesel allocated by the company for this site. Enter litres OR rupees. It is the company budget — it does not add to physical stock.'},
  purchase:{l:'Purchased',s:'Purchased',hint:'Diesel actually bought. Paid from company allocation first; anything above the allocation is counted as your own money. Adds to physical stock.'},
  fill:{l:'Filled',s:'Filled',hint:'Diesel filled into the DG. Enter litres OR rupees. Reduces physical stock.'},
  opening:{l:'Balance',s:'Balance',hint:'Sets the physical stock to this value (0 and minus allowed). Use it to start, or after checking the stock physically.'},
  usage:{l:'Filled',s:'Filled'},tin:{s:'Received'},tout:{s:'Transferred'},filled:{s:'Filled (Diesel Filling)'}
};
const TABS=['allocation','purchase','fill','opening'];
const FILLK=['fill','usage','filled'];
const fmtRs=v=>isNum(v)?'₹'+(+v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const fmtL=v=>fmtN(v,2)+' L';
const sgn=v=>v>0.004?'+':v<-0.004?'−':'';
const colr=v=>v>0.004?'var(--g1)':v<-0.004?'var(--r)':'var(--m)';
const sL=v=>`<span style="color:${colr(v)};font-weight:700">${sgn(v)}${fmtN(Math.abs(v),2)} L</span>`;
const sR=v=>`<span style="color:${colr(v)};font-weight:700">${sgn(v)}${fmtRs(Math.abs(v))}</span>`;
const tL=v=>`${sgn(v)}${fmtN(Math.abs(v),2)} L`,tR=v=>`${sgn(v)}${fmtRs(Math.abs(v))}`;
const stockRecs=()=>live().filter(r=>r.type==='stock');
function priceOn(day){const h=(S.priceHistory||[]).filter(p=>p.from<=day).sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:((a.auto?0:1)-(b.auto?0:1))||((a.at||0)-(b.at||0)));return h.length?+h[h.length-1].price:+(S.dieselPrice||100.80)}
const autoFillOn=()=>S.stockAutoFill===true;
function stockStart(sid){const st=siteById(sid)||{};if(st.stockStart)return st.stockStart;const ds=stockRecs().filter(r=>r.site===sid||r.data.to===sid).map(r=>dayOf(r.dt)).sort();return ds[0]||''}
/* derive the three balances from cumulative totals */
function derive(t){
  t.compBalL=r2(t.allocation-t.purchase);t.compBalR=r2(t.allocAmt-t.purchaseAmt);
  t.persL=r2(Math.max(0,t.purchase-t.allocation));t.persR=r2(Math.max(0,t.purchaseAmt-t.allocAmt));
  t.compPurchL=r2(Math.min(t.purchase,t.allocation));t.compPurchR=r2(Math.min(t.purchaseAmt,t.allocAmt));
  t.stock=r2(t.adj+t.purchase+t.tin-t.filled-t.tout);
  const avail=t.adj+t.compPurchL+t.tin,out=t.filled+t.tout,fromC=Math.min(out,Math.max(0,avail));
  t.compStock=r2(avail-fromC);t.persStock=r2(t.persL-(out-fromC));
  return t;
}
const zeroT=()=>({adj:0,allocation:0,allocAmt:0,purchase:0,purchaseAmt:0,filled:0,filledAmt:0,tin:0,tout:0,n:0});
function addMove(t,m){
  t.n++;
  if(m.kind==='opening')t.adj+=m.delta;
  else if(m.kind==='allocation'){t.allocation+=m.qty;t.allocAmt+=m.amount}
  else if(m.kind==='purchase'){t.purchase+=m.qty;t.purchaseAmt+=m.amount}
  else if(FILLK.includes(m.kind)){t.filled+=m.qty;t.filledAmt+=m.amount}
  else if(m.kind==='tin')t.tin+=m.qty;else if(m.kind==='tout')t.tout+=m.qty;
}
/* full ledger for one site with running balances */
function stockMoves(sid){
  const out=[];
  stockRecs().forEach(r=>{const d=r.data,q=+d.qty||0;
    if(d.kind==='transfer'){if(r.site===sid)out.push({r,dt:r.dt,kind:'tout',qty:q,amount:null,price:null});if(d.to===sid)out.push({r,dt:r.dt,kind:'tin',qty:q,amount:null,price:null});return}
    if(r.site!==sid)return;
    out.push({r,dt:r.dt,kind:d.kind,qty:q,amount:isNum(d.amount)?+d.amount:null,price:isNum(d.price)?+d.price:null});
  });
  const start=stockStart(sid);
  if(autoFillOn()&&start)recsOf(sid,'diesel').forEach(r=>{const q=+r.data.filled||0;if(q>0&&dayOf(r.dt)>=start)out.push({r,dt:r.dt,kind:'filled',qty:q,auto:true,amount:null,price:null})});
  const pr={opening:0,allocation:1,purchase:2,tin:3,filled:4,fill:4,usage:5,tout:6};
  const key=m=>m.dt+'|'+String(m.r.createdAt||0).padStart(15,'0');
  const opens=out.filter(m=>m.kind==='opening').map(key).sort();
  out.forEach(m=>{const d=dayOf(m.dt),k=key(m);m.seg=opens.filter(o=>o.slice(0,10)===d&&o<=k).length});
  out.sort((a,b)=>{const da=dayOf(a.dt),db=dayOf(b.dt);if(da!==db)return da<db?-1:1;if(a.seg!==b.seg)return a.seg-b.seg;if(pr[a.kind]!==pr[b.kind])return pr[a.kind]-pr[b.kind];return key(a)<key(b)?-1:key(a)>key(b)?1:0});
  const t=zeroT();let bal=0;
  out.forEach(m=>{
    const p=m.price||priceOn(dayOf(m.dt));m.p=p;
    m.est=m.amount==null;if(m.est)m.amount=r2(m.qty*p);
    m.open=bal;
    m.delta=m.kind==='opening'?r2(m.qty-bal):['purchase','tin'].includes(m.kind)?m.qty:(FILLK.includes(m.kind)||m.kind==='tout')?-m.qty:0;
    bal=r2(bal+m.delta);
    addMove(t,m);const d=derive({...t});
    Object.assign(m,{bal:d.stock,close:d.stock,compBalL:d.compBalL,compBalR:d.compBalR,persL:d.persL,persStock:d.persStock,compStock:d.compStock});
  });
  return out;
}
function stockSum(moves){const t=zeroT();moves.forEach(m=>addMove(t,m));Object.keys(t).forEach(k=>t[k]=r2(t[k]));derive(t);t.inL=r2(t.purchase+t.tin);t.outL=r2(t.filled+t.tout);return t}
const movesBetween=(sid,from,to,all)=>(all||stockMoves(sid)).filter(m=>{const d=dayOf(m.dt);return(!from||d>=from)&&(!to||d<=to)});
const stockOf=(sid,upto)=>stockSum(movesBetween(sid,'',upto));
/* add site summaries together (personal funding is per site, so sum the site values) */
function sumSites(list){const T={};['allocation','allocAmt','purchase','purchaseAmt','filled','filledAmt','compPurchL','compPurchR','compBalL','compBalR','persL','persR','stock','compStock','persStock','tin','tout','adj'].forEach(k=>T[k]=r2(list.reduce((s,t)=>s+(t[k]||0),0)));return T}
function stState(v){return v>0.004?{t:'PLUS',sym:'+',c:'var(--g1)',bg:'var(--gl)'}:v<-0.004?{t:'MINUS',sym:'−',c:'var(--r)',bg:'var(--rl)'}:{t:'ZERO',sym:'0',c:'var(--m)',bg:'#eef1ef'}}
function stBadge(v,big){const s=stState(v);return `<span class="badge" style="background:${s.bg};color:${s.c};${big?'font-size:12px;padding:4px 10px':''}">${s.t} ${s.sym}</span>`}
const today=()=>dayOf(nowLocal());
function dtFor(day){const n=nowLocal();return day===dayOf(n)?n:day+'T'+n.slice(11,16)}

/* three-section summary block (company / own money / physical) */
function summaryHTML(t,price){
  const R=(l,L,A,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="r">${L}</td><td class="r">${A}</td></tr>`;
  return `<div class="sumsec sec-c"><div class="sh">🏢 Company Allocation</div><table class="tbl"><tr><th></th><th class="r">Litres</th><th class="r">Amount</th></tr>
      ${R('Allocated by company',fmtL(t.allocation),fmtRs(t.allocAmt))}
      ${R('Purchased from allocation',fmtL(t.compPurchL),fmtRs(t.compPurchR))}
      ${R('<b>Company allocation balance</b><br><small>allocated − purchased</small>',sL(t.compBalL),sR(t.compBalR),'hl')}</table></div>
    <div class="sumsec sec-p"><div class="sh">👤 My Own Money</div><table class="tbl"><tr><th></th><th class="r">Litres</th><th class="r">Amount</th></tr>
      ${R('Personally funded diesel<br><small>purchased above allocation</small>',`<span style="color:${t.persL>0.004?'var(--r)':'var(--m)'};font-weight:700">${fmtL(t.persL)}</span>`,`<span style="color:${t.persR>0.004?'var(--r)':'var(--m)'};font-weight:700">${fmtRs(t.persR)}</span>`,'hl')}
      ${R('Personally funded stock remaining',sL(t.persStock),'≈ '+tR(r2(t.persStock*price)))}</table></div>
    <div class="sumsec sec-s"><div class="sh">🛢️ Physical Diesel Stock</div><table class="tbl"><tr><th></th><th class="r">Litres</th><th class="r">Amount</th></tr>
      ${t.adj?R('Balance set / adjusted',sL(t.adj),''):''}
      ${R('Purchased (total)',fmtL(t.purchase),fmtRs(t.purchaseAmt))}
      ${R('Filled',fmtL(t.filled),fmtRs(t.filledAmt))}
      ${t.tin||t.tout?R('Received / transferred out',`${fmtN(t.tin,2)} / ${fmtN(t.tout,2)} L`,''):''}
      ${R('<b>Available physical stock</b>',sL(t.stock),'≈ '+tR(r2(t.stock*price)),'hl')}
      ${R('<small>of which company-funded</small>',`<small>${tL(t.compStock)}</small>`,'')}
      ${R('<small>of which own-money</small>',`<small>${tL(t.persStock)}</small>`,'')}</table></div>`;
}
/* ---------- daily diesel price (Kanyakumari) from price.json made by the GitHub job ---------- */
function priceUrls(){
  const u=[];const m=location.hostname.match(/^([^.]+)\.github\.io$/);const repo=location.pathname.split('/').filter(Boolean)[0];
  if(m&&repo&&!/\.html?$/.test(repo)){u.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/main/price.json`,`https://raw.githubusercontent.com/${m[1]}/${repo}/master/price.json`)}
  u.push('price.json');return u;
}
function applyAuto(listKey,infoKey,o){
  if(!o||!(+o.price>50&&+o.price<200)||!/^\d{4}-\d{2}-\d{2}$/.test(o.date||''))return false;
  S[infoKey]={price:+o.price,date:o.date,source:o.source||'online',confirmed:!!o.confirmed,checked:Date.now()};
  const L=S[listKey]||[];const exists=L.some(p=>p.from===o.date&&(!p.auto||Math.abs(p.price-o.price)<0.001));
  if(!exists)S[listKey]=L.filter(p=>!(p.auto&&p.from===o.date)).concat([{price:+o.price,from:o.date,user:'Auto · '+(o.source||'online'),auto:true,at:Date.now()}]);
  return !exists;
}
async function autoPrice(force){
  const wantD=S.autoPrice!==false,wantP=S.autoPetrol!==false;
  if((!wantD&&!wantP)||!navigator.onLine)return null;
  if(!force&&localStorage.getItem('fr_priceChk')===today()&&(S.autoInfo||S.autoPetrolInfo))return S.autoInfo;
  for(const u of priceUrls()){
    try{
      const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)continue;
      const j=await r.json();
      const dsl=j.diesel||(j.price?{price:j.price,date:j.date,source:j.source,confirmed:j.confirmed}:null);
      let changed=false;
      if(wantD&&applyAuto('priceHistory','autoInfo',dsl))changed=true;
      if(wantP&&applyAuto('petrolHistory','autoPetrolInfo',j.petrol))changed=true;
      if(!S.autoInfo&&!S.autoPetrolInfo)continue;
      localStorage.setItem('fr_priceChk',today());
      S.dieselPrice=priceOn(today());S.petrolPrice=petrolOn(today());saveS();
      if(changed&&/^#\/(stock|travel)/.test(location.hash||'')&&!$('#modal .bg'))route();
      return S.autoInfo;
    }catch(e){}
  }
  return null;
}

  <div class="field" data-r="amtbox"><div class="lbl" data-r="amtlbl">Amount (₹)</div><input class="inp" type="number" step="any" inputmode="decimal" data-r="amount" value="${val.amount??''}" placeholder="Rupees"></div>
  <div class="calc" data-r="calc"></div>
  <div class="field"><div class="lbl">Remarks</div><input class="inp sm" data-r="remarks" value="${esc(val.remarks||'')}" placeholder="Optional"></div>`;

function bindStockForm(root,sid,rec,onDone){
  const q=n=>root.querySelector(`[data-r="${n}"]`);
  let kind=rec?(rec.data.kind==='usage'?'fill':rec.data.kind):'allocation',mode=rec?.data.mode==='amount'?'amount':'litres';
  const before=()=>{
    const all=stockMoves(sid);
    if(rec){const i=all.findIndex(x=>x.r===rec);if(i>0)return derive(stockSum(all.slice(0,i)));if(i===0)return derive(stockSum([]))}
    return stockSum(movesBetween(sid,'',q('day').value||today(),all));
  };
  function calc(){
    const price=+q('price').value,useAmt=mode==='amount',bal=kind==='opening';
    q('qtybox').style.display=useAmt?'none':'';q('amtbox').style.display=useAmt?'':'none';
    q('qtylbl').textContent=bal?'New balance (L) — 0 or minus allowed':'Litres';
    q('amtlbl').textContent=bal?'New balance value (₹) — 0 or minus allowed':'Amount (₹)';
    q('khint').textContent=SK[kind].hint;
    root.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('on',b.dataset.kind===kind));
    root.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
    const B=before();
    q('prev').innerHTML=`<div class="l"><span>Physical stock now</span><b>${sL(B.stock)}</b></div><div class="l"><span>Company allocation balance</span><b>${sL(B.compBalL)}</b></div>`;
    const qv=q('qty').value,av=q('amount').value;let qty,amt;
    if(useAmt){amt=av===''?NaN:+av;qty=isNum(amt)&&price?r2(amt/price):NaN}else{qty=qv===''?NaN:+qv;amt=isNum(qty)&&price?r2(qty*price):NaN}
    // preview the three balances after this entry
    const A=B.allocation+(kind==='allocation'?qty||0:0),Aa=B.allocAmt+(kind==='allocation'?amt||0:0),P=B.purchase+(kind==='purchase'?qty||0:0),Pa=B.purchaseAmt+(kind==='purchase'?amt||0:0);
    const stock=bal?(isNum(qty)?qty:B.stock):kind==='purchase'?B.stock+(qty||0):kind==='fill'?B.stock-(qty||0):B.stock;
    q('calc').innerHTML=`<div class="l"><span>Litres</span><b>${isNum(qty)?fmtL(qty):'—'}</b></div><div class="l"><span>Amount</span><b>${isNum(amt)?fmtRs(amt):'—'}</b></div>
      <div class="l tot"><span>After this entry</span><b></b></div>
      <div class="l"><span>Physical stock</span><b>${sL(r2(stock))}</b></div>
      <div class="l"><span>Company balance</span><b>${sL(r2(A-P))} · ${sR(r2(Aa-Pa))}</b></div>
      ${P>A?`<div class="l"><span>Own money used</span><b style="color:var(--r)">${fmtL(r2(P-A))} · ${fmtRs(r2(Math.max(0,Pa-Aa)))}</b></div>`:''}`;
    return {qty,amt,price};
  }
  root.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;calc()});
  root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;calc()});
  ['qty','amount','price'].forEach(n=>q(n).oninput=calc);
  q('day').onchange=()=>{if(!rec)q('price').value=priceOn(q('day').value||today());calc()};
  calc();
  return async()=>{
    const v=calc(),day=q('day').value;
    if(!day)return toast('Select a date');
    if(!(v.price>0))return toast('Enter price per litre');
    if(kind==='opening'){if(!isNum(v.qty))return toast('Enter the balance (0 is allowed)')}
    else if(!(v.qty>0))return toast(mode==='amount'?'Enter the amount':'Enter litres');
    if(kind==='fill'){const avail=before().stock;if(v.qty>avail+0.004&&!confirm(`Filling ${v.qty} L is more than the stock (${fmtN(avail,2)} L). Save anyway? Stock will show MINUS.`))return}
    const data={kind,qty:r2(v.qty),amount:r2(v.amt),price:r2(v.price),mode,remarks:q('remarks').value.trim()};
    const site=siteById(sid);let r;
    if(rec){r=rec;r.history=(r.history||[]).concat([{at:Date.now(),user:S.user,dt:r.dt,data:r.data}]);r.dt=dayOf(r.dt)===day?r.dt:dtFor(day);r.data=data;r.editedBy=S.user}
    else r={id:uid(),type:'stock',site:sid,siteName:site.name,dt:dtFor(day),user:S.user,phone:S.phone,email:ACCOUNT?ACCOUNT.email:'',createdAt:Date.now(),deleted:false,data,src:{}};
    await putRec(r);onDone(r);
  };
}

/* ---------- transfer (physical stock only) ---------- */
function openTransfer(fromSid,rec){
  const d=rec?rec.data:{};fromSid=rec?rec.site:fromSid||'';
  const opts=sel=>activeSites().map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
  modal(`<h3>${rec?'Edit':'Diesel Stock'} Transfer</h3>
    <div class="setf"><label>From site</label><select class="sel" id="tf"><option value="">Select…</option>${opts(fromSid)}</select><div class="hint" id="tav"></div></div>
    <div class="setf"><label>To site</label><select class="sel" id="tt"><option value="">Select…</option>${opts(d.to||'')}</select></div>
    <div class="g2"><div class="setf"><label>Quantity (L)</label><input class="sel" id="tq" type="number" step="any" inputmode="decimal" value="${d.qty??''}"></div>
    <div class="setf"><label>Date</label><input class="sel" id="td" type="date" max="${today()}" value="${rec?dayOf(rec.dt):today()}"></div></div>
    <div class="setf"><label>Remarks</label><input class="sel" id="tr" value="${esc(d.remarks||'')}" placeholder="e.g. Emergency diesel requirement"></div>
    <div class="err" id="terr"></div>
    <div class="btns"><button class="btn b-gr" onclick="closeModal()">Cancel</button><button class="btn b-t" id="tsave">${I.swap}${rec?'Save':'Transfer'}</button></div>`);
  const avail=()=>{const f=$('#tf').value;if(!f)return 0;let a=stockOf(f).stock;if(rec&&rec.site===f)a+=+rec.data.qty;return r2(a)};
  const upd=()=>{const f=$('#tf').value;$('#tav').innerHTML=f?`Available stock: <b>${sL(avail())}</b>`:''};
  $('#tf').onchange=upd;upd();
  $('#tsave').onclick=async()=>{
    const f=$('#tf').value,t=$('#tt').value,qty=r2(+$('#tq').value),day=$('#td').value;$('#terr').textContent='';
    if(!f||!t)return $('#terr').textContent='Select both sites.';
    if(f===t)return $('#terr').textContent='From and To site must be different.';
    if(!(qty>0))return $('#terr').textContent='Enter quantity.';
    const a=avail();if(qty>a)return $('#terr').textContent=`Not allowed: only ${fmtL(Math.max(0,a))} available at ${siteName(f)}.`;
    const p=priceOn(day);const data={kind:'transfer',qty,to:t,toName:siteName(t),remarks:$('#tr').value.trim(),mode:'litres',price:p,amount:r2(qty*p)};
    let r;
    if(rec){r=rec;r.history=(r.history||[]).concat([{at:Date.now(),user:S.user,dt:r.dt,site:r.site,data:r.data}]);r.site=f;r.siteName=siteName(f);r.dt=dayOf(r.dt)===day?r.dt:dtFor(day);r.data=data;r.editedBy=S.user}
    else r={id:uid(),type:'stock',site:f,siteName:siteName(f),dt:dtFor(day),user:S.user,phone:S.phone,email:ACCOUNT?ACCOUNT.email:'',createdAt:Date.now(),deleted:false,data,src:{}};
    await putRec(r);closeModal();toast(`${fmtL(qty)} transferred ${siteName(f)} → ${siteName(t)}`);route();
  };
}

/* ---------- transaction cards ---------- */
const KL={allocation:'ALLOCATED',purchase:'PURCHASED',fill:'FILLED',usage:'FILLED',opening:'BALANCE',tin:'RECEIVED',tout:'TRANSFER OUT',filled:'FILLED (DG)'};
const KC={allocation:'tg-diesel',purchase:'tg-request',fill:'tg-energy',usage:'tg-energy',opening:'tg-stock',tin:'tg-stock',tout:'tg-stock',filled:'tg-energy'};
function txCard(m,showSite){
  const eff=m.kind==='allocation'?0:m.delta;
  const qtyTxt=m.kind==='opening'?`set to ${tL(m.qty)}`:m.kind==='allocation'?`${fmtN(m.qty,2)} L`:`${sgn(eff)}${fmtN(Math.abs(eff),2)} L`;
  return `<div class="txc" data-mid="${m.r.id}" data-auto="${m.auto?1:''}">
    <div class="txh"><b>${fmtD(m.dt)}</b><small>${m.dt.slice(11,16)}</small>${showSite?`<b style="color:var(--tt)">${esc(m.site)}</b>`:''}<span class="tg ${KC[m.kind]}">${KL[m.kind]}</span>${m.r.history?.length?'<small style="color:var(--y)">edited</small>':''}${m.auto?'<small>from Diesel Filling</small>':''}</div>
    ${m.kind==='tin'?`<div class="hint" style="margin:0 0 4px">From ${esc(siteName(m.r.site))}</div>`:m.kind==='tout'?`<div class="hint" style="margin:0 0 4px">To ${esc(siteName(m.r.data.to))}</div>`:''}
    ${m.r.data?.remarks&&!m.auto?`<div class="hint" style="margin:0 0 4px">“${esc(m.r.data.remarks)}”</div>`:''}
    <div class="txg">
      <div><span>Litres</span><b style="color:${m.kind==='allocation'?'var(--g1)':colr(eff)}">${qtyTxt}</b></div>
      <div><span>Amount</span><b>${m.est?'≈ ':''}${fmtRs(m.amount)}</b><small>@ ${fmtN(m.p,2)}/L</small></div>
      <div><span>Stock balance</span><b>${sL(m.bal)}</b></div>
      <div><span>Company balance</span><b>${sL(m.compBalL)}</b><small>${sR(m.compBalR)}</small></div>
      ${m.persL>0.004?`<div style="grid-column:1/3"><span>Own money so far</span><b style="color:var(--r)">${fmtL(m.persL)}</b></div>`:''}
    </div></div>`;
}
function bindTx(){$$('.txc[data-mid]').forEach(el=>el.onclick=()=>el.dataset.auto?recDetail(el.dataset.mid):stockDetail(el.dataset.mid))}
function txFilters(F,withSite){
  return `<div class="filters">${withSite?`<select class="sel" id="fs" style="grid-column:1/3"><option value="">All sites</option>${activeSites().map(s=>`<option value="${s.id}" ${F.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}
    <select class="sel" id="fk" style="grid-column:1/3"><option value="">All transaction types</option>${[['allocation','Allocated'],['purchase','Purchased'],['fill','Filled'],['opening','Balance'],['tin','Received'],['tout','Transferred out']].map(([k,l])=>`<option value="${k}" ${F.kind===k?'selected':''}>${l}</option>`).join('')}</select>

const kindMatch=(k,f)=>!f||k===f||(f==='fill'&&FILLK.includes(k));
function inOutBoxes(F){
  return `<div class="g2" style="margin-bottom:10px">
    <div class="cbox c"><h4>DIESEL IN</h4><div class="d" style="color:var(--g1);margin:2px 0 0">+${fmtN(F.inL,2)} L</div><small style="color:var(--m)">Purchased ${fmtRs(F.purchaseAmt)}</small></div>
    <div class="cbox" style="background:var(--rl);border:1px solid #f3c2bd"><h4 style="color:var(--r)">DIESEL OUT</h4><div class="d" style="color:var(--r);margin:2px 0 0">−${fmtN(F.outL,2)} L</div><small style="color:var(--m)">Filled ${fmtRs(F.filledAmt)}</small></div></div>`;

/* ---------- site stock page ---------- */
const STF={kind:'',from:'',to:'',newest:true};
function StockSite(sid){
  const site=siteById(sid);if(!site)return StockHome();
  autoPrice();
  const all=stockMoves(sid),t=stockSum(all),pNow=priceOn(today());
  let list=all.filter(m=>kindMatch(m.kind,STF.kind)&&(!STF.from||dayOf(m.dt)>=STF.from)&&(!STF.to||dayOf(m.dt)<=STF.to));
  const F=stockSum(list);if(STF.newest)list=list.slice().reverse();
  render(header('Stock - '+site.name,'#/stock')+`<div class="wrap">
    <div class="g2" style="margin-bottom:12px">
      <div class="bigv" style="background:${stState(t.stock).bg};margin:0;padding:12px"><div style="font-size:11.5px;color:var(--m)">Physical stock</div><b style="font-size:26px;color:${colr(t.stock)}">${tL(t.stock)}</b><div style="font-size:12px;color:var(--m)">≈ ${tR(r2(t.stock*pNow))}</div></div>
      <div class="bigv" style="background:${stState(t.compBalL).bg};margin:0;padding:12px"><div style="font-size:11.5px;color:var(--m)">Company balance</div><b style="font-size:26px;color:${colr(t.compBalL)}">${tL(t.compBalL)}</b><div style="font-size:12px;color:${colr(t.compBalR)}">${tR(t.compBalR)}</div></div></div>
    ${summaryHTML(t,pNow)}
    <div class="btns" style="margin:4px 0 14px"><button class="btn b-gr" onclick="dailyReport('${sid}')">${I.hist}Daily Report</button><button class="btn b-t" onclick="openTransfer('${sid}')">${I.swap}Transfer</button></div>
    <div class="card" id="sform"><h3>New Entry</h3>${stockFormHTML(all.length?'allocation':'opening')}<button class="btn b-g" id="ssave" style="width:100%">${I.save}Save Entry</button></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px"><div class="sec-t" style="margin:0">All Transactions (${list.length})</div><button class="btn b-gr" id="ford" style="flex:none;padding:7px 12px;font-size:12.5px">${STF.newest?'Newest first ↓':'Oldest first ↑'}</button></div>
    ${txFilters(STF,false)}
    ${list.length?inOutBoxes(F)+list.map(m=>txCard(m,false)).join('')+'<div class="hint">“≈” = value at the diesel price of that date. Tap a transaction to edit.</div>':'<div class="empty">No transactions yet. Start with a Balance entry (0 is fine), then add Allocated / Purchased / Filled.</div>'}
  </div>`,'home');
  $('#ssave').onclick=bindStockForm($('#sform'),sid,null,r=>{toast(SK[r.data.kind].l+' saved');StockSite(sid)});
  const rf=()=>{STF.kind=$('#fk').value;STF.from=$('#ff').value;STF.to=$('#ft').value;StockSite(sid)};
  ['#fk','#ff','#ft'].forEach(x=>$(x).onchange=rf);
  $('#ford').onclick=()=>{STF.newest=!STF.newest;StockSite(sid)};
  bindTx();
}

/* ---------- all transactions, all sites ---------- */
const ATF={site:'',kind:'',from:'',to:''};
function StockAllTx(){
  if(!ATF.from&&!ATF.to)ATF.from=today().slice(0,7)+'-01';
  const sites=ATF.site?[siteById(ATF.site)].filter(Boolean):activeSites();
  let list=[];sites.forEach(s=>stockMoves(s.id).forEach(m=>{m.site=s.name;list.push(m)}));
  list=list.filter(m=>kindMatch(m.kind,ATF.kind)&&(!ATF.from||dayOf(m.dt)>=ATF.from)&&(!ATF.to||dayOf(m.dt)<=ATF.to));
  const F=stockSum(list);

/* ================= TRAVEL & FUEL (scooter) ================= */
/* km from Google Maps Timeline export + manual entries; petrol fill-ups; estimated vs real mileage.
   Records: type 'travel' kind 'timeline' (one per day, id tl-YYYY-MM-DD) | kind 'manual'
            type 'fuel'   (petrol fill-up)                                                     */
const TV_DEFAULT_TYPES=['motorcycling','in passenger vehicle','in vehicle','driving','in two wheeler','unknown'];
function travelCfg(){const t=S.travel||{};return {mileage:isNum(t.mileage)&&+t.mileage>0?+t.mileage:45,vehicle:t.vehicle||'Scooter',types:Array.isArray(t.types)?t.types:TV_DEFAULT_TYPES.slice()}}
function petrolOn(day){const h=(S.petrolHistory||[]).filter(p=>p.from<=day).sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:((a.auto?0:1)-(b.auto?0:1))||((a.at||0)-(b.at||0)));return h.length?+h[h.length-1].price:+(S.petrolPrice||108.68)}
const tvRecs=()=>live().filter(r=>r.type==='travel');
const fuelRecs=()=>live().filter(r=>r.type==='fuel').sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:0);
const normType=t=>String(t||'unknown').toLowerCase().replace(/_/g,' ').replace(/\s+/g,' ').trim();
const typeLabel=t=>t.replace(/\b\w/g,c=>c.toUpperCase());
function kmOfDay(day,recs){
  recs=recs||tvRecs();const types=travelCfg().types;let tl=0,man=0;const trips=[];
  recs.forEach(r=>{if(r.data.day!==day)return;
    if(r.data.kind==='timeline')(r.data.trips||[]).forEach((t,i)=>{const inc=types.includes(t.type)&&!t.x;if(inc)tl+=t.km;trips.push({...t,inc,rec:r,i})});
    else{man+=+r.data.km||0}});
  return {tl:r2(tl),man:r2(man),km:r2(tl+man),trips};
}
function travelDays(from,to){
  const recs=tvRecs(),days={};
  recs.forEach(r=>{const d=r.data.day;if(d>=from&&d<=to)days[d]=1});
  fuelRecs().forEach(r=>{const d=dayOf(r.dt);if(d>=from&&d<=to)days[d]=1});
  const mil=travelCfg().mileage;
  return Object.keys(days).sort().map(d=>{const k=kmOfDay(d,recs);const L=r2(k.km/mil),p=petrolOn(d);
    const fills=fuelRecs().filter(f=>dayOf(f.dt)===d);
    return {day:d,...k,estL:L,estR:r2(L*p),price:p,fillL:r2(fills.reduce((s,f)=>s+(+f.data.litres||0),0)),fillR:r2(fills.reduce((s,f)=>s+(+f.data.amount||0),0))}});
}
/* real mileage between fill-ups: full-tank method with odometer, else approx from recorded km */
function realMileage(){
  const fills=fuelRecs();const out=[];
  let last=null,litresSince=0;
  fills.forEach(f=>{
    const d=f.data;
    if(last){litresSince+=+d.litres||0}
    if(d.full!==false){
      if(last){
        const L=litresSince;let km=null,how='';
        if(isNum(d.odo)&&isNum(last.data.odo)&&+d.odo>+last.data.odo){km=r2(+d.odo-+last.data.odo);how='odometer'}
        else{let s=0;const a=dayOf(last.dt),b=dayOf(f.dt);let x=a;while(x<b){s+=kmOfDay(x).km;x=addDays(x,1)}if(s>0){km=r2(s);how='timeline / manual km'}}
        if(km&&L>0)out.push({id:f.id,from:last.dt,to:f.dt,km,litres:r2(L),mileage:r2(km/L),how});
      }
      last=f;litresSince=0;
    }
  });
  return out;
}

/* ---------- Google Maps Timeline import ---------- */
function timelineHelp(){
  modal(`<h3>Export Timeline on iPhone</h3>
    <ol style="padding-left:18px;line-height:1.7;font-size:14px;margin:0 0 10px">
    <li>Open <b>Google Maps</b> and tap your <b>profile picture</b> (top-right).</li>
    <li>Tap <b>Settings</b> → <b>Personal content</b>.</li>
    <li>Tap <b>Export Timeline data</b>.</li>
    <li>Choose <b>Save to Files</b> → <b>On My iPhone</b> → Save. The file is called <b>Timeline.json</b>.</li>
    <li>Come back here → <b>Import Timeline</b> → pick that file.</li></ol>
    <div class="note">Timeline must be ON in Google Maps (profile → Your Timeline). Google keeps Timeline only on the phone, so no app can read it automatically — export and import once a week or month. Importing the same days again replaces them, so nothing is counted twice.</div>
    <button class="btn b-gr" style="width:100%" onclick="closeModal()">OK</button>`);
}
const pad15=n=>String(n).padStart(15,'0');
function parsePoint(p){
  if(!p)return null;
  if(typeof p==='object'){if(p.latLng)return parsePoint(p.latLng);if(isNum(p.latitudeE7))return [p.latitudeE7/1e7,p.longitudeE7/1e7];if(isNum(p.latE7))return [p.latE7/1e7,p.lngE7/1e7];if(isNum(p.latitude))return [+p.latitude,+p.longitude];if(isNum(p.lat))return [+p.lat,+(p.lng??p.lon)];return null}
  const m=String(p).replace('geo:','').replace(/°/g,'').split(',').map(x=>parseFloat(x));return m.length>=2&&isFinite(m[0])&&isFinite(m[1])?[m[0],m[1]]:null;
}
function hav(a,b){const R=6371,t=x=>x*Math.PI/180;const dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function localParts(iso){const d=new Date(iso);if(isNaN(d))return null;return {day:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,hm:`${pad(d.getHours())}:${pad(d.getMinutes())}`,t:d.getTime()}}
function parseTimeline(j){
  const segs=[],paths=[];
  const arr=Array.isArray(j)?j:Array.isArray(j?.semanticSegments)?j.semanticSegments:null;
  if(arr){
    arr.forEach(x=>{if(Array.isArray(x.timelinePath)){const st=new Date(x.startTime).getTime();x.timelinePath.forEach(p=>{const pt=parsePoint(p.point);const t=p.time?new Date(p.time).getTime():st+(+p.durationMinutesOffsetFromStartTime||0)*60000;if(pt&&isFinite(t))paths.push({t,pt})})}});
    paths.sort((a,b)=>a.t-b.t);
    arr.forEach(x=>{const a=x.activity;if(!a||!x.startTime)return;
      const s=localParts(x.startTime),e=localParts(x.endTime||x.startTime);if(!s)return;
      let km=parseFloat(a.distanceMeters)/1000,est=false;
      if(!(km>0)){const pts=paths.filter(p=>p.t>=s.t&&p.t<=e.t).map(p=>p.pt);const A=parsePoint(a.start),B=parsePoint(a.end);const all=[A,...pts,B].filter(Boolean);
        km=0;for(let i=1;i<all.length;i++)km+=hav(all[i-1],all[i]);est=true}
      segs.push({day:s.day,s:s.hm,e:e.hm,type:normType(a.topCandidate?.type||a.type),km:r2(km||0),est})});
  }else if(Array.isArray(j?.timelineObjects)){
    j.timelineObjects.forEach(o=>{const a=o.activitySegment;if(!a)return;const du=a.duration||{};
      const st=du.startTimestamp||(du.startTimestampMs&&new Date(+du.startTimestampMs).toISOString()),et=du.endTimestamp||(du.endTimestampMs&&new Date(+du.endTimestampMs).toISOString())||st;
      const s=localParts(st),e=localParts(et);if(!s)return;
      let km=(+a.distance||+a.waypointPath?.distanceMeters||0)/1000,est=false;
      if(!(km>0)){const A=parsePoint(a.startLocation),B=parsePoint(a.endLocation);km=A&&B?hav(A,B):0;est=true}
      segs.push({day:s.day,s:s.hm,e:e.hm,type:normType(a.activityType||a.activities?.[0]?.activityType),km:r2(km),est})});
  }else if(Array.isArray(j?.locations)){throw new Error('This is Records.json (raw GPS points, no trips). Please export Timeline from the Google Maps app instead.')}
  else throw new Error('Not a Google Maps Timeline file.');
  return segs.filter(x=>x.km>0);
}
function importTimeline(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    modal(`<h3>Import Timeline</h3><div class="loader"><div class="spin"></div>Reading ${esc(f.name)} (${fmtN(f.size/1048576,1)} MB)…</div>`);
    let segs;
    try{const txt=await f.text();segs=parseTimeline(JSON.parse(txt))}
    catch(e){return modal(`<h3>Import Timeline</h3><div class="warn">${I.alert}<span>${esc(e.message.includes('JSON')?'This file could not be read. Pick the Timeline.json exported from Google Maps.':e.message)}</span></div><button class="btn b-gr" style="width:100%" onclick="closeModal()">Close</button>`)}
    if(!segs.length)return modal(`<h3>Import Timeline</h3><div class="empty">No trips with distance found in this file.</div><button class="btn b-gr" style="width:100%" onclick="closeModal()">Close</button>`);
    const days=segs.map(s=>s.day).sort();const first=days[0],last=days[days.length-1];
    const lastImp=tvRecs().filter(r=>r.data.kind==='timeline').map(r=>r.data.day).sort().pop();
    let from=lastImp&&lastImp>=first&&lastImp<=last?lastImp:(addDays(today(),-90)>first?addDays(today(),-90):first);
    const types=travelCfg().types;
    const show=()=>{
      const fr=$('#imf').value||first,to=$('#imt').value||last;
      const sel=segs.filter(s=>s.day>=fr&&s.day<=to);const by={};sel.forEach(s=>{by[s.type]=by[s.type]||{n:0,km:0};by[s.type].n++;by[s.type].km+=s.km});
      const cur=$$('#imtypes .on').map(b=>b.dataset.t);const inc=cur.length||$('#imtypes').dataset.init?cur:types;
      $('#imtypes').dataset.init=1;
      $('#imtypes').innerHTML=Object.entries(by).sort((a,b)=>b[1].km-a[1].km).map(([t,v])=>`<button data-t="${esc(t)}" class="${inc.includes(t)?'on':''}">${esc(typeLabel(t))} · ${fmtN(v.km,1)} km</button>`).join('');
      $$('#imtypes [data-t]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');sum()});
      sum();
      function sum(){const on=$$('#imtypes .on').map(b=>b.dataset.t);const km=sel.filter(s=>on.includes(s.type)).reduce((a,s)=>a+s.km,0);const nd=new Set(sel.map(s=>s.day)).size;
        $('#imsum').innerHTML=`<div class="l"><span>Days in range</span><b>${nd}</b></div><div class="l"><span>Trips</span><b>${sel.length}</b></div><div class="l tot"><span>${esc(travelCfg().vehicle)} km (selected types)</span><b>${fmtN(km,1)} km</b></div>`}
    };
    modal(`<h3>Import Timeline</h3>
      <div class="hint" style="margin-bottom:8px">File has trips from <b>${fmtD(first)}</b> to <b>${fmtD(last)}</b>.</div>
      <div class="g2"><div class="setf"><label>From</label><input class="sel" type="date" id="imf" value="${from}" min="${first}" max="${last}"></div><div class="setf"><label>To</label><input class="sel" type="date" id="imt" value="${last}" min="${first}" max="${last}"></div></div>
      <div class="setf"><label>Count these trip types as ${esc(travelCfg().vehicle)} km</label><div class="opts" id="imtypes"></div></div>
      <div class="calc" id="imsum"></div>
      <div class="hint">Days in this range are replaced if imported before — nothing is counted twice. Manual km entries are kept.</div>
      <div class="btns"><button class="btn b-gr" onclick="closeModal()">Cancel</button><button class="btn b-p" id="imgo">${I.upload}Import</button></div>`);
    show();$('#imf').onchange=show;$('#imt').onchange=show;
    $('#imgo').onclick=async()=>{
      const fr=$('#imf').value||first,to=$('#imt').value||last;const on=$$('#imtypes .on').map(b=>b.dataset.t);
      if(!on.length)return toast('Select at least one trip type');
      const cfg=travelCfg();S.travel={...cfg,types:[...new Set([...cfg.types.filter(t=>!$$('#imtypes [data-t]').some(b=>b.dataset.t===t)),...on])]};saveS();
      $('#imgo').disabled=true;$('#imgo').textContent='Saving…';
      const byDay={};segs.filter(s=>s.day>=fr&&s.day<=to).forEach(s=>{(byDay[s.day]=byDay[s.day]||[]).push({s:s.s,e:s.e,type:s.type,km:s.km,...(s.est?{est:1}:{})})});
      let n=0;
      for(const [day,trips] of Object.entries(byDay)){
        const id='tl-'+day,old=RECS.find(r=>r.id===id);
        trips.sort((a,b)=>a.s<b.s?-1:1);
        if(old&&!old.deleted)(old.data.trips||[]).forEach(t=>{if(t.x){const m=trips.find(x=>x.s===t.s&&x.type===t.type);if(m)m.x=1}});
        await putRec({id,type:'travel',site:'',siteName:'',dt:day+'T23:59',user:S.user,email:ACCOUNT?ACCOUNT.email:'',createdAt:old?.createdAt||Date.now(),deleted:false,src:{},data:{kind:'timeline',day,trips,file:f.name}});n++;
      }
      await saveSiteConfig();
      closeModal();toast(`${n} day(s) imported`);TV.month=to.slice(0,7);route();
    };
  };
  inp.click();
}

function recDetail(id){
  const r=RECS.find(x=>x.id===id);if(!r)return;
  if(r.type==='stock')return stockDetail(id);
  if(r.type==='fuel')return addFill(id);
  if(r.type==='travel')return r.data.kind==='manual'?addKm(id):dayTrips(r.data.day);
  const s=k=>{const v=(r.src||{})[k];return v&&v!=='MANUAL'?` <span class="badge bd-${v}">${v==='EST'?'EST':v}</span>`:''};
  let body='';
  if(r.type==='diesel'){const d=r.data;body=`<span>EB kWh</span><b>${fmtN(d.kwh)}${s('kwh')}</b><span>DG HMR</span><b>${fmtN(d.dg)}${s('dg')}</b><span>PIU HMR</span><b>${fmtN(d.piu)}${s('piu')}</b><span>Prev DG / date</span><b>${d.prev?fmtN(d.prev.dg)+' · '+fmtD(d.prev.dt):'—'}</b><span>Opening</span><b>${fmtN(d.opening,1)} L</b><span>Filled</span><b>${fmtN(d.filled,1)} L</b><span>DG hrs diff</span><b>${fmtN(d.dgDiff)}</b><span>Consumption</span><b>${fmtN(d.consumption,1)} L</b><span>Closing</span><b>${fmtN(d.closing,1)} L</b>`}
  else if(r.type==='energy'){const d=r.data;body=`<span>EB kWh</span><b>${fmtN(d.kwh)}${s('kwh')}</b><span>EB kVAh</span><b>${fmtN(d.kvah)}${s('kvah')}</b><span>DG HMR</span><b>${fmtN(d.dg)}${s('dg')}</b><span>PIU HMR</span><b>${fmtN(d.piu)}${s('piu')}</b>`+Object.keys(d.ops||{}).map(o=>{const c=d.ops?.[o];if(!c||!CHS.some(x=>isNum(c[x]?.kw)||isNum(c[x]?.amp)))return '';return `<span style="grid-column:1/3;font-weight:800;color:var(--t);margin-top:6px">${o}</span>`+CHS.map(x=>`<span>CH${x} kW / Amp</span><b>${fmtN(c[x]?.kw)}${s(`${o}.${x}.kw`)} / ${fmtN(c[x]?.amp)}${s(`${o}.${x}.amp`)}</b>`).join('')}).join('')}
  else body=`<span style="grid-column:1/3"></span></div><textarea class="msg" style="min-height:260px" readonly>${esc(r.data.message)}</textarea><div>`;
  modal(`<h3>${esc(siteName(r.site))} · ${r.type}</h3><div class="dl"><span>Date</span><b>${fmtDT(r.dt)}</b><span>Entered by</span><b>${esc(r.user||'—')}</b>${body}</div>
  <div class="btns">${r.type==='request'?`<button class="btn b-wa" id="rwa">${I.wa}Resend</button>`:''}<button class="btn b-r" id="del">Delete</button><button class="btn b-gr" onclick="closeModal()">Close</button></div>`);
  $('#del').onclick=async()=>{if(!confirm('Delete this record? It will be removed from all devices.'))return;r.deleted=true;await putRec(r);closeModal();toast('Record deleted');History()};
  if($('#rwa'))$('#rwa').onclick=()=>window.open(`https://wa.me/${(siteCfg(r.site).wa||'').replace(/\D/g,'')}?text=${encodeURIComponent(r.data.message)}`,'_blank');
}

async function exportExcel(list){
  list=list||live();
  toast('Preparing Excel…',4000);
  try{await loadScript(CDN.xlsx)}catch(e){return toast(e.message)}
  const by=t=>list.filter(r=>r.type===t).sort((a,b)=>a.dt<b.dt?-1:1);
  const dt=r=>[fmtD(r.dt),r.dt.slice(11,16)];
  const wb=XLSX.utils.book_new();
  const add=(name,head,rows)=>{const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=head.map(h=>({wch:Math.max(10,String(h).length+2)}));XLSX.utils.book_append_sheet(wb,ws,name)};
  const n=v=>isNum(v)?+v:'';
  add('Diesel Filling Records',['Record ID','Date','Time','Site','EB kWh','kWh Source','DG HMR','DG Source','PIU HMR','PIU Source','Prev Date','Prev kWh','Prev DG HMR','Prev PIU HMR','Opening (L)','Filled (L)','DG Hrs Diff','Consumption (L)','Closing (L)','Rate L/Hr','User','Phone','Email'],
