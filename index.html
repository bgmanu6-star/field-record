html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--t);font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:calc(78px + env(safe-area-inset-bottom));position:relative}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:8px 0 7px;color:var(--m);text-decoration:none;font-size:11px;font-weight:600}

.slist{list-style:none;margin:0;padding:0}
.slist li a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.slist li a:active{background:var(--gl)}
.num{width:28px;height:28px;border-radius:8px;background:var(--g1);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

.field{margin-bottom:14px}
.lbl{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-bottom:6px}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;letter-spacing:.3px}
.bd-OCR{background:var(--bl);color:var(--b)}.bd-EST{background:var(--ol);color:#b65400}.bd-MANUAL{display:none}
.row{display:flex;gap:8px;align-items:stretch}

.inp:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 3px var(--gb)}
.inp.est{background:var(--ol);border-color:#f3b77d;font-style:italic}
.inp.ocr{background:var(--bl);border-color:#9cc2f0}
.inp.bad{border-color:var(--r);background:var(--rl)}

.t-cam{background:var(--bl);color:var(--b)}.t-est{background:var(--gl);color:var(--g1)}
.hint{font-size:12px;color:var(--m);margin-top:4px}
.err{font-size:12px;color:var(--r);margin-top:4px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.warn{background:var(--rl);color:var(--r);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;gap:8px}
.note{background:var(--yl);color:var(--y);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.btns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}

.b-g{background:var(--g1);color:#fff}.b-gr{background:#eef1ef;color:var(--t)}.b-o{background:var(--o);color:#fff}.b-wa{background:#1fa855;color:#fff}.b-b{background:var(--b);color:#fff}.b-r{background:var(--rl);color:var(--r)}

.loader .spin{border-color:var(--gb);border-top-color:var(--g1);width:22px;height:22px}
.mt{margin-top:12px}
.foot{text-align:center;padding:22px 18px 10px;color:var(--m);font-size:12px;line-height:1.6}
.foot .by{font-size:13px;color:var(--t)}.foot .by b{color:var(--g)}

.foot small{display:block;font-size:10.5px;opacity:.85;margin-top:4px}
.applogo{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:block;margin:0 auto}
</style>

function siteCfg(sid){const s=siteById(sid)||{};const n=(v,d)=>isNum(v)?+v:d;

function applySiteConfig(rec){
  if(!rec||rec.type!=='config'||!Array.isArray(rec.data&&rec.data.sites))return false;
  if((S.sitesAt||0)>=(rec.updatedAt||0))return false;
  S.sites=rec.data.sites;S.sitesAt=rec.updatedAt||Date.now();saveS();return true;
}
async function saveSiteConfig(){

/* ================= LOCAL DB (IndexedDB) ================= */
const DB={db:null,
open(){return new Promise((res,rej)=>{const r=indexedDB.open('fieldrecord',1);r.onupgradeneeded=()=>r.result.createObjectStore('records',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
all(){return new Promise(res=>{const q=this.db.transaction('records').objectStore('records').getAll();q.onsuccess=()=>res(q.result||[])})},
put(rec){return new Promise((res,rej)=>{const t=this.db.transaction('records','readwrite');t.objectStore('records').put(rec);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
let RECS=[];
const live=()=>RECS.filter(r=>!r.deleted&&r.type!=='config');
let PENDING=new Set(JSON.parse(localStorage.getItem('fr_pending')||'[]'));
const savePending=()=>localStorage.setItem('fr_pending',JSON.stringify([...PENDING]));
async function putRec(rec,{fromRemote=false}={}){
  if(!fromRemote){rec.updatedAt=Date.now();PENDING.add(rec.id);savePending()}
  await DB.put(rec);
  const i=RECS.findIndex(r=>r.id===rec.id);if(i>=0)RECS[i]=rec;else RECS.push(rec);
  if(!fromRemote){Sync.push()}
  else if(rec.type==='config'&&applySiteConfig(rec)&&!/^#\/(diesel|energy|request)\/|^#\/msg/.test(location.hash))setTimeout(route,0);
  status();
}

/* ================= DATA QUERIES ================= */
function recsOf(sid,type){return live().filter(r=>r.site===sid&&(!type||r.type===type)).sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:0)}
function fval(r,f){
  if(f==='fuel')return r.type==='diesel'&&isNum(r.data.closing)?+r.data.closing:undefined;
  const v=r.data[f];return isNum(v)?+v:undefined;
}
/* history of a field across diesel+energy records of a site */
function fieldHist(sid,f,{actualOnly=false}={}){
  const out=[];
  recsOf(sid).forEach(r=>{if(r.type==='request')return;const v=fval(r,f);if(v===undefined)return;const src=f==='fuel'?'CALC':(r.src||{})[f]||'MANUAL';if(actualOnly&&src==='EST')return;out.push({dt:r.dt,day:dayOf(r.dt),v,src,type:r.type})});
  return out;
}
function lastBefore(hist,day,inclusive){for(let i=hist.length-1;i>=0;i--){if(inclusive?hist[i].day<=day:hist[i].day<day)return hist[i]}return null}
function lastRecBefore(sid,type,day){const a=recsOf(sid,type).filter(r=>dayOf(r.dt)<day);return a[a.length-1]||null}
function sameDayRec(sid,type,day){return recsOf(sid,type).find(r=>dayOf(r.dt)===day)}

/* estimate a cumulative meter value at time dt from history */
function estimateField(sid,f,dt){
  let h=fieldHist(sid,f,{actualOnly:true}).filter(x=>x.dt<dt);
  if(!h.length)return null;
  const last=h[h.length-1];
  const win=h.filter(x=>daysBetween(x.dt,last.dt)<=120);
  const first=win[0];const span=daysBetween(first.dt,last.dt);
  const rate=span>=0.5?(last.v-first.v)/span:0;
  const el=Math.max(0,daysBetween(last.dt,dt));
  let est=last.v+rate*el;
  est=(f==='kwh'||f==='kvah')?Math.round(est):Math.round(est*10)/10;
  return {last,rate,elapsed:el,est,points:win.length};
}
function opHist(sid,op,ch,f){
  const out=[];recsOf(sid,'energy').forEach(r=>{const c=r.data.ops?.[op]?.[ch];if(!c||!isNum(c[f]))return;const src=(r.src||{})[`${op}.${ch}.${f}`]||'MANUAL';if(src==='EST')return;out.push({dt:r.dt,v:+c[f]})});return out;
}

/* signed-in Google account (cached so the app opens offline) */
let ACCOUNT=JSON.parse(localStorage.getItem('fr_account')||'null');
const Sync={ready:false,busy:false,err:'',unsub:null,loaded:false,
async load(){
  if(this.loaded)return;
  await loadScript(CDN.fbApp);await loadScript(CDN.fbAuth);await loadScript(CDN.fbStore);
  if(!firebase.apps.length)firebase.initializeApp(S.firebase);
  try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
  this.db=firebase.firestore();this.loaded=true;
},
async init(){
  if(!S.firebase){status();return}
  try{
    await this.load();
    if(this.watching)return;this.watching=true;
    firebase.auth().onAuthStateChanged(async u=>{
      if(u){
        ACCOUNT={name:u.displayName||'',email:u.email||'',photo:u.photoURL||''};
        localStorage.setItem('fr_account',JSON.stringify(ACCOUNT));
        if(!S.user){S.user=ACCOUNT.name;saveS()}
        this.ready=true;this.err='';this.needLogin=false;this.listen();await this.push();
        if(location.hash==='#/login')location.hash='#/';else if(!/^#\/(diesel|energy|request)\/|^#\/msg/.test(location.hash))route();
      }else{
        this.ready=false;if(this.unsub){this.unsub();this.unsub=null}
        // keep the cached account so the app opens normally; just flag that sync needs a sign-in
        if(ACCOUNT)this.needLogin=true;else route();
      }
      status();
    });
  }catch(e){this.err=e.message||String(e);console.warn(e)}
  status();
},
async login(){
  await this.load();
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  await firebase.auth().signInWithPopup(p);
},
async logout(){if(this.loaded)await firebase.auth().signOut();ACCOUNT=null;localStorage.removeItem('fr_account');location.hash='#/login';route()},
listen(){
  if(this.unsub)this.unsub();
  const since=+localStorage.getItem('fr_lastPull')||0;
  this.unsub=this.db.collection('records').where('updatedAt','>',since).onSnapshot(async snap=>{
    let changed=false,max=+localStorage.getItem('fr_lastPull')||0;
    for(const c of snap.docChanges()){
      const d=c.doc.data();max=Math.max(max,d.updatedAt||0);
      const loc=RECS.find(r=>r.id===d.id);
      if(PENDING.has(d.id)&&loc&&loc.updatedAt>=d.updatedAt)continue;
      if(!loc||(loc.updatedAt||0)<(d.updatedAt||0)){await putRec(d,{fromRemote:true});changed=true}
    }
    localStorage.setItem('fr_lastPull',max);
    if(changed&&!/^#\/(diesel|energy|request)\/|^#\/msg/.test(location.hash))route();
  },e=>{this.err=/permission/i.test(e.message)?'This Gmail ID is not allowed. Ask the admin to add it.':e.message;status();if(location.hash==='#/settings')Settings()});
},
async push(){
  if(!this.ready||!navigator.onLine||this.busy||!PENDING.size){status();return}
  this.busy=true;status();
  try{
    const ids=[...PENDING];
    for(let i=0;i<ids.length;i+=400){
      const b=this.db.batch();
      ids.slice(i,i+400).forEach(id=>{const r=RECS.find(x=>x.id===id);if(r)b.set(this.db.collection('records').doc(id),r)});
      await b.commit();
      ids.slice(i,i+400).forEach(id=>PENDING.delete(id));savePending();
    }
    this.err='';
  }catch(e){this.err=e.message;console.warn(e)}
  this.busy=false;status();
},
async fullResync(){localStorage.setItem('fr_lastPull','0');RECS.forEach(r=>PENDING.add(r.id));savePending();if(this.ready){this.listen();await this.push()}}
};
window.addEventListener('online',()=>{Sync.ready?Sync.push():Sync.init();status()});
window.addEventListener('offline',status);
function status(){
  const el=$('#sync');if(!el)return;
  let h;
  if(Sync.busy)h='<div class="spin"></div>Syncing';
  else if(!navigator.onLine)h=`<span class="dot off"></span>Offline${PENDING.size?' · '+PENDING.size:''}`;
  else if(!S.firebase)h='<span class="dot wait"></span>Local only';
  else if(!ACCOUNT)h='<span class="dot wait"></span>Not signed in';
  else if(Sync.needLogin)h='<span class="dot wait"></span>Tap to sign in';
  else if(Sync.err)h='<span class="dot off"></span>Sync error';
  else if(PENDING.size)h=`<span class="dot wait"></span>${PENDING.size} pending`;
  else h='<span class="dot"></span>Synced';
  el.innerHTML=h;
}

/* ================= SITE LIST ================= */
function SiteList(mode){
  const t={diesel:'Diesel Filling',energy:'Energy Reading',request:'Make Diesel Request'}[mode];
  const acc={diesel:'',energy:'acc-b',request:'acc-o'}[mode];
  const items=activeSites().map((s,i)=>{
    const type=mode==='request'?'diesel':mode;const rs=recsOf(s.id,type);const last=rs[rs.length-1];
    let sub=last?`Last: ${fmtD(last.dt)}`:'No records yet';
    if(last&&mode!=='energy'&&isNum(last.data.closing))sub+=` · Fuel ${fmtN(last.data.closing,1)} L`;
    return `<li><a href="#/${mode}/${s.id}"><span class="num">${i+1}</span><span class="nm"><b>${esc(s.name)}</b><small>${sub}</small></span><span class="ar">${I.chev}</span></a></li>`}).join('');
  render(header(t,'#/')+`<div class="wrap" style="padding-bottom:0"><div class="sec-t">Select Site</div></div><ul class="slist ${acc}">${items}</ul>`,'home');
}

/* ================= READING FIELD COMPONENT ================= */
function rField(key,label,val,src,{cam=true,est=true,hint=''}={}){
  return `<div class="field"><div class="lbl">${label} <span class="badge bd-${src||'MANUAL'}" id="bd-${key}">${src==='EST'?'ESTIMATE':src||''}</span></div>
  <div class="row"><input class="inp ${src==='EST'?'est':src==='OCR'?'ocr':''}" id="f-${key}" data-k="${key}" type="number" inputmode="decimal" step="any" value="${isNum(val)?val:''}" placeholder="Enter reading">
  ${cam?`<button class="tbtn t-cam" data-cam="${key}">${I.cam}Camera</button>`:''}
  ${est?`<button class="tbtn t-est" data-est="${key}">${I.est}Estimate</button>`:''}</div>
  <div class="hint" id="h-${key}">${hint}</div><div class="err" id="e-${key}"></div></div>`;
}
function setSrc(F,key,src){
  F.src[key]=src;const el=$('#f-'+key),bd=$('#bd-'+key);
  if(el){el.classList.toggle('est',src==='EST');el.classList.toggle('ocr',src==='OCR')}
  if(bd){bd.className='badge bd-'+src;bd.textContent=src==='EST'?'ESTIMATE':src==='OCR'?'OCR':''}
}

/* ================= OCR ================= */
let ocrWorker=null,ocrInit=null,ocrProg='';
const TESS_CORE='https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core-lstm.wasm.js';
function withTimeout(pr,ms,msg){return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))])}
function ocrLog(m){
  if(m.status){const pct=m.progress?Math.round(m.progress*100):0;
    const label={'loading tesseract core':'Downloading OCR engine','initializing tesseract':'Starting OCR','loading language traineddata':'Downloading digit data','initializing api':'Preparing','recognizing text':'Reading digits'}[m.status]||m.status;
    ocrProg=`${label}${pct?` ${pct}%`:''}…`;const el=$('#ocrst');if(el)el.textContent=ocrProg;const bar=$('#ocrbar');if(bar)bar.style.width=(pct||5)+'%'}
}
function getWorker(){
  if(ocrWorker)return Promise.resolve(ocrWorker);
  if(ocrInit)return ocrInit;
  ocrInit=(async()=>{
    await loadScript(CDN.tess);
    // LSTM-only engine (oem 1) + non-SIMD core: smaller download, works on all iPhones/Android
    const w=await withTimeout(Tesseract.createWorker('eng',1,{corePath:TESS_CORE,logger:ocrLog}),120000,'OCR engine download timed out. Check internet and try again.');
    await w.setParameters({tessedit_char_whitelist:'0123456789.',tessedit_pageseg_mode:'7'});
    ocrWorker=w;return w;
  })().catch(e=>{ocrInit=null;throw e});
  return ocrInit;
}
/* warm up in background so the first scan is fast */
function preloadOCR(){if(navigator.onLine&&!ocrWorker&&!ocrInit&&!localStorage.getItem('fr_noocr'))setTimeout(()=>getWorker().catch(()=>{}),1500)}
function prepImage(file){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,1100/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    const orig=c.toDataURL('image/jpeg',.85);
    const d=x.getImageData(0,0,w,h),p=d.data;let sum=0;
    for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=p[i+1]=p[i+2]=g;sum+=g}
    const avg=sum/(p.length/4);const inv=avg<110;
    for(let i=0;i<p.length;i+=4){let g=p[i];if(inv)g=255-g;g=g<(inv?255-avg:avg)*0.85?0:255;p[i]=p[i+1]=p[i+2]=g}
    x.putImageData(d,0,0);res({orig,proc:c.toDataURL('image/png')});URL.revokeObjectURL(img.src)};
    img.onerror=()=>rej(new Error('Could not open the photo. Try again.'));img.src=URL.createObjectURL(file)});
}
function pickNumber(text){
  const m=(text||'').replace(/\s+/g,'').match(/\d+(\.\d+)?/g)||[];
  return m.sort((a,b)=>b.replace('.','').length-a.replace('.','').length)[0]||'';
}
/* opens camera; cb(value,target) */
function openOCR(title,cb,choices){
  const inp=$('#camIn');inp.value='';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    let target=choices?choices[0]:null,done=false;
    modal(`<h3>${esc(title)}</h3><div class="loader"><div class="spin"></div>Opening photo…</div>`);
    let orig,proc;
    try{({orig,proc}=await prepImage(f))}catch(e){return modal(`<h3>Camera</h3><div class="warn">${I.alert}${esc(e.message)}</div><button class="btn b-gr" onclick="closeModal()">Close</button>`)}
    const result=(v,msg)=>{
      if(done)return;done=true;
      $('#ocrl')&&$('#ocrl').remove();
      $('#ocrr').innerHTML=`<div class="lbl mt">Detected Reading</div>
        <input class="inp" id="ocrv" type="number" inputmode="decimal" step="any" value="${esc(v)}" placeholder="Type the reading from the photo">
        <div class="hint">${msg}</div>
        ${choices?`<div class="lbl mt">Apply to</div><div class="opts">${choices.map((c,i)=>`<button data-ch="${c}" class="${c===target?'on':''}">${c}</button>`).join('')}</div>`:''}
        <div class="btns"><button class="btn b-gr" id="ocrRe">${I.cam}Retake</button><button class="btn b-g" id="ocrUse">${I.ok}Use Reading</button></div>`;
      $$('[data-ch]').forEach(b=>b.onclick=()=>{$$('[data-ch]').forEach(x=>x.classList.remove('on'));b.classList.add('on');target=b.dataset.ch});
      $('#ocrRe').onclick=()=>{closeModal();openOCR(title,cb,choices)};
      $('#ocrUse').onclick=()=>{const val=$('#ocrv').value;if(!isNum(val))return toast('Enter a valid number');closeModal();cb(val,target)};
      if(!v)setTimeout(()=>$('#ocrv')&&$('#ocrv').focus(),100);
    };
    modal(`<h3>${esc(title)}</h3><img class="ocrimg" src="${orig}">
      <div id="ocrl" style="margin-top:12px"><div style="display:flex;align-items:center;gap:10px;color:var(--m);font-size:14px"><div class="spin" style="border-color:var(--gb);border-top-color:var(--g1);width:18px;height:18px"></div><span id="ocrst">${ocrWorker?'Reading digits…':(ocrProg||'Downloading OCR engine (first time only)…')}</span></div>
      <div style="height:6px;background:var(--gl);border-radius:4px;margin:10px 0;overflow:hidden"><div id="ocrbar" style="height:100%;width:5%;background:var(--g1);transition:width .3s"></div></div>
      <button class="btn b-gr" id="ocrSkip" style="width:100%">Type it myself</button></div><div id="ocrr"></div>`);
    $('#ocrSkip').onclick=()=>result('','Read the number from the photo above and type it.');
    try{
      const w=await getWorker();if(done)return;
      const st=$('#ocrst');if(st)st.textContent='Reading digits…';
      let r=await withTimeout(w.recognize(proc),40000,'Reading took too long.');let v=pickNumber(r.data.text);
      if(!v&&!done){r=await withTimeout(w.recognize(orig),40000,'Reading took too long.');v=pickNumber(r.data.text)}
      result(v,v?'Check the value against the photo and correct if needed.':'Could not read the digits clearly. Retake closer and straight, or type the value.');
    }catch(e){result('',esc(e.message||String(e))+' You can type the value from the photo.')}
  };
  inp.click();
}

/* estimate dialog */
function showEstimate(sid,key,label,dt,cb){
  const e=estimateField(sid,key,dt);
  if(!e)return toast('No previous actual reading for this site to estimate from');
  modal(`<h3>Estimate ${esc(label)}</h3>
  <div class="dl"><span>Previous reading</span><b>${fmtN(e.last.v)}</b><span>Previous date</span><b>${fmtDT(e.last.dt)}</b>
  <span>Average per day</span><b>${e.points>1?fmtN(e.rate,2):'— (only 1 reading)'}</b><span>Days elapsed</span><b>${fmtN(e.elapsed,1)}</b></div>
  <div class="bigv o"><div style="font-size:12px;color:var(--m)">Estimated reading</div><b>${fmtN(e.est)}</b></div>
  <div class="note">This value will be saved and marked as <b>ESTIMATE</b>, never as an actual meter reading.</div>
  <div class="btns"><button class="btn b-gr" onclick="closeModal()">Cancel</button><button class="btn b-o" id="useEst">Use Estimated Value</button></div>`);
  $('#useEst').onclick=()=>{closeModal();cb(e.est)};
}

/* ================= DIESEL FILLING PAGE ================= */
function DieselPage(sid){
  const site=siteById(sid);if(!site)return SiteList('diesel');preloadOCR();const SC=siteCfg(sid);
  const F={dt:nowLocal(),src:{},kwh:'',dg:'',piu:'',opening:'',filled:''};
  const prevInfo=()=>{
    const day=dayOf(F.dt);
    const prev=lastRecBefore(sid,'diesel',day);
    const kwhP=lastBefore(fieldHist(sid,'kwh'),day,false);
    return {prev,kwhP};
  };
  let P=prevInfo();
  F.opening=P.prev&&isNum(P.prev.data.closing)?Math.max(0,+P.prev.data.closing):SC.opening;
  function hints(){
    P=prevInfo();
    $('#h-kwh').textContent=P.kwhP?`Previous: ${fmtN(P.kwhP.v)} on ${fmtD(P.kwhP.dt)}`:'No previous reading';
    $('#h-dg').textContent=P.prev&&isNum(P.prev.data.dg)?`Previous: ${fmtN(P.prev.data.dg)} on ${fmtD(P.prev.dt)}`:'No previous DG reading (first record)';
    $('#h-piu').textContent=P.prev&&isNum(P.prev.data.piu)?`Previous: ${fmtN(P.prev.data.piu)} on ${fmtD(P.prev.dt)}`:'No previous PIU reading';
    $('#pinfo').innerHTML=`<span>Previous Date</span><b>${P.prev?fmtD(P.prev.dt):'—'}</b><span>Last DG HMR</span><b>${P.prev?fmtN(P.prev.data.dg):'—'}</b><span>Last EB kWh</span><b>${P.kwhP?fmtN(P.kwhP.v):'—'}</b><span>Last PIU HMR</span><b>${P.prev?fmtN(P.prev.data.piu):'—'}</b><span>Last Fuel</span><b>${P.prev?fmtN(P.prev.data.closing,1)+' L':'—'}</b>`;
  }
  function calc(){
    const prevDg=P.prev&&isNum(P.prev.data.dg)?+P.prev.data.dg:null;
    const dgDiff=isNum(F.dg)&&prevDg!=null?r2(+F.dg-prevDg):0;
    const cons=r2(Math.max(0,dgDiff)*SC.rate);
    const closing=r2((+F.opening||0)+(+F.filled||0)-cons);
    return {prevDg,dgDiff,cons,closing};
  }
  function upd(){
    const c=calc();
    ['kwh','dg','piu'].forEach(k=>{const e=$('#e-'+k);e.textContent='';$('#f-'+k).classList.remove('bad')});
    const chk=(k,prev)=>{if(isNum(F[k])&&prev!=null&&+F[k]<prev){$('#e-'+k).textContent=`Lower than previous reading (${fmtN(prev)}). Check meter.`;$('#f-'+k).classList.add('bad')}};
    chk('kwh',P.kwhP?P.kwhP.v:null);chk('dg',c.prevDg);chk('piu',P.prev&&isNum(P.prev.data.piu)?+P.prev.data.piu:null);
    $('#calc').className='calc'+(c.closing<0?' neg':'');
    $('#calc').innerHTML=`<div class="l"><span>Opening balance</span><b>${fmtN(F.opening||0,1)} L</b></div>
    <div class="l"><span>Diesel filled</span><b>${fmtN(F.filled||0,1)} L</b></div>
    <div class="l"><span>DG hours difference</span><b>${fmtN(c.dgDiff)} Hrs</b></div>
    <div class="l"><span>Diesel consumption (${SC.rate} L/Hr)</span><b>${fmtN(c.cons,1)} L</b></div>
    <div class="l tot"><span>Closing Diesel Balance</span><b>${fmtN(c.closing,1)} L</b></div>`;
    const over=SC.tank&&c.closing>SC.tank?`<div class="note">Closing balance (${fmtN(c.closing,1)} L) is more than this site's tank capacity (${SC.tank} L). Check diesel filled.</div>`:'';
    $('#negw').innerHTML=over+(c.closing<0?`<div class="warn">${I.alert}<span>Closing balance is negative (${fmtN(c.closing,1)} L). Check DG hours, opening balance or diesel filled before saving.</span></div>`:'');
  }
  render(header('Diesel Filling - '+site.name,'#/diesel')+`<div class="wrap">
    <div style="text-align:right;margin:-4px 0 6px"><a href="javascript:editSite('${sid}',true)" style="font-size:12.5px;color:var(--g1);font-weight:700">⚙ Site settings (${SC.rate} L/Hr${SC.tank?' · tank '+SC.tank+' L':''})</a></div>
    <div class="info" id="pinfo"></div>
    <div class="field"><div class="lbl">Date &amp; Time</div><input class="inp sm" type="datetime-local" id="f-dt" value="${F.dt}"></div>
    ${rField('kwh','EB kWh Reading','', '')}
    ${rField('dg','DG Running Hours (HMR)','','',{est:false})}
    ${rField('piu','PIU Running Hours (HMR)','','',{est:false})}
    <div class="g2"><div class="field"><div class="lbl">Opening Diesel (L)</div><input class="inp" id="f-opening" data-k="opening" type="number" inputmode="decimal" step="any" value="${F.opening}"></div>
    <div class="field"><div class="lbl">Diesel Filled (L)</div><input class="inp" id="f-filled" data-k="filled" type="number" inputmode="decimal" step="any" placeholder="0"></div></div>
    <div class="hint" style="margin:-8px 0 10px">Opening balance = last closing balance (or ${SC.opening} L for the first record). Edit if a dip shows otherwise.</div>
    <div id="calc" class="calc"></div><div id="negw"></div>
    <div class="btns"><button class="btn b-g" id="save">${I.save}Save Record</button><button class="btn b-gr" id="clr">${I.clear}Clear</button></div>
  </div>`,'home');
  hints();upd();
  $('#f-dt').onchange=e=>{F.dt=e.target.value||nowLocal();hints();if(!$('#f-opening').dataset.touched){const p=P.prev;F.opening=p&&isNum(p.data.closing)?Math.max(0,+p.data.closing):SC.opening;$('#f-opening').value=F.opening}upd()};
  $$('[data-k]').forEach(el=>el.oninput=()=>{const k=el.dataset.k;F[k]=el.value;if(k==='opening')el.dataset.touched=1;if(['kwh','dg','piu'].includes(k))setSrc(F,k,'MANUAL');upd()});
  $$('[data-cam]').forEach(b=>b.onclick=()=>{const k=b.dataset.cam;openOCR({kwh:'EB kWh',dg:'DG HMR',piu:'PIU HMR'}[k],v=>{F[k]=v;$('#f-'+k).value=v;setSrc(F,k,'OCR');upd()})});
  $$('[data-est]').forEach(b=>b.onclick=()=>{const k=b.dataset.est;showEstimate(sid,k,'EB kWh',F.dt,v=>{F[k]=v;$('#f-'+k).value=v;setSrc(F,k,'EST');upd()})});
  $('#clr').onclick=()=>{if(confirm('Clear all entered values?'))DieselPage(sid)};
  $('#save').onclick=async()=>{
    if(!isNum(F.dg))return toast('Enter DG running hours');
    const c=calc();
    if(c.closing<0&&!confirm(`Closing balance is NEGATIVE (${fmtN(c.closing,1)} L).\nThis usually means a wrong reading. Save anyway?`))return;
    if($$('.inp.bad').length&&!confirm('Some readings are lower than the previous reading (meter reset/replaced?). Save anyway?'))return;
    const day=dayOf(F.dt);const dup=sameDayRec(sid,'diesel',day);
    if(dup&&!confirm(`A diesel record for ${site.name} on ${fmtD(day)} already exists.\nOK = replace it with this one\nCancel = do not save`))return;
    const rec={id:dup?dup.id:uid(),type:'diesel',site:sid,siteName:site.name,dt:F.dt,user:S.user,phone:S.phone,email:ACCOUNT?ACCOUNT.email:'',createdAt:dup?dup.createdAt:Date.now(),deleted:false,
      data:{kwh:isNum(F.kwh)?+F.kwh:'',dg:+F.dg,piu:isNum(F.piu)?+F.piu:'',opening:+F.opening||0,filled:+F.filled||0,dgDiff:c.dgDiff,consumption:c.cons,closing:c.closing,rate:SC.rate,
        prev:P.prev?{dt:P.prev.dt,dg:P.prev.data.dg,piu:P.prev.data.piu,closing:P.prev.data.closing}:null,prevKwh:P.kwhP?{dt:P.kwhP.dt,v:P.kwhP.v}:null},
      src:{kwh:isNum(F.kwh)?F.src.kwh||'MANUAL':'',dg:F.src.dg||'MANUAL',piu:isNum(F.piu)?F.src.piu||'MANUAL':''}};
    await putRec(rec);
    modal(`<div class="okbig"><div class="c">${I.ok}</div><b>Record Saved Successfully!</b></div>
    <div class="dl"><span>Site</span><b>${esc(site.name)}</b><span>Date</span><b>${fmtDT(rec.dt)}</b><span>EB kWh</span><b>${fmtN(rec.data.kwh)} ${rec.src.kwh==='EST'?'(Est.)':''}</b><span>DG HMR</span><b>${fmtN(rec.data.dg)}</b><span>PIU HMR</span><b>${fmtN(rec.data.piu)}</b><span>Opening</span><b>${fmtN(rec.data.opening,1)} L</b><span>Filled</span><b>${fmtN(rec.data.filled,1)} L</b><span>Consumption</span><b>${fmtN(rec.data.consumption,1)} L</b><span>Closing balance</span><b>${fmtN(rec.data.closing,1)} L</b></div>
    <div class="btns"><button class="btn b-gr" onclick="location.hash='#/history'">View History</button><button class="btn b-g" onclick="location.hash='#/'">Back to Menu</button></div>`);
  };
}

/* ================= ENERGY PAGE ================= */
function EnergyPage(sid){
  const site=siteById(sid);if(!site)return SiteList('energy');preloadOCR();const SOPS=siteCfg(sid).ops;
  const F={dt:nowLocal(),kwh:'',kvah:'',src:{},ops:{}};
  SOPS.forEach(o=>{F.ops[o]={};CHS.forEach(c=>F.ops[o][c]={kw:'',amp:''})});
  let tab=SOPS[0];let P;
  const prevE=()=>lastRecBefore(sid,'energy',dayOf(F.dt));
  function hints(){
    P=prevE();const day=dayOf(F.dt);
    const k=lastBefore(fieldHist(sid,'kwh'),day,false),v=lastBefore(fieldHist(sid,'kvah'),day,false);
    $('#h-kwh').textContent=k?`Previous: ${fmtN(k.v)} on ${fmtD(k.dt)}`:'No previous reading';
    $('#h-kvah').textContent=v?`Previous: ${fmtN(v.v)} on ${fmtD(v.dt)}`:'No previous reading';
    $('#pinfo').innerHTML=`<span>Previous Date</span><b>${P?fmtD(P.dt):'—'}</b><span></span><b></b><span>EB kWh</span><b>${k?fmtN(k.v):'—'}</b><span>EB kVAh</span><b>${v?fmtN(v.v):'—'}</b>`;
    hints.k=k;hints.v=v;
  }
  function opTable(){
    const prevOps=P?.data.ops?.[tab]||{};
    $('#tabs').innerHTML=SOPS.map(o=>{const has=CHS.some(c=>isNum(F.ops[o][c].kw)||isNum(F.ops[o][c].amp));return `<button data-tab="${o}" class="${o===tab?'on':''}">${o}${has?'<span class="tk"></span>':''}</button>`}).join('');
    $('#optbl').innerHTML=`<tr><th>CH</th><th>kW</th><th>Amp</th><th></th></tr>`+CHS.map(c=>{
      const v=F.ops[tab][c],pv=prevOps[c]||{};
      const cls=f=>{const s=F.src[`${tab}.${c}.${f}`];return s==='EST'?'est':s==='OCR'?'ocr':''};
      return `<tr><td>CH${c}</td>
      <td><input class="inp ${cls('kw')}" data-op="${c}" data-f="kw" type="number" inputmode="decimal" step="any" value="${v.kw}" placeholder="${isNum(pv.kw)?'prev '+pv.kw:'kW'}"></td>
      <td><input class="inp ${cls('amp')}" data-op="${c}" data-f="amp" type="number" inputmode="decimal" step="any" value="${v.amp}" placeholder="${isNum(pv.amp)?'prev '+pv.amp:'A'}"></td>
      <td><div class="mini"><button class="mb t-cam" data-ocam="${c}">${I.cam}</button><button class="mb t-est" data-oest="${c}">${I.est}</button></div></td></tr>`}).join('');

/* ================= DIESEL REQUEST ================= */
const RF=[['kwh','EB kWh'],['kvah','EB kVAh'],['dg','DG HMR'],['piu','PIU HMR'],['fuel','Fuel level']];
function buildSnapshot(sid){
  const H={};RF.forEach(([f])=>H[f]=fieldHist(sid,f));
  const cur={},prev={};
  RF.forEach(([f])=>{const h=H[f];if(h.length)cur[f]=h[h.length-1]});
  const curDays=['dg','fuel'].map(f=>cur[f]?.day).filter(Boolean);
  const curDay=curDays.length?curDays.sort().pop():Object.values(cur).map(x=>x.day).sort().pop();
  if(!curDay)return null;
  const target=addDays(curDay,-30);let fallback=false;
  RF.forEach(([f])=>{let p=lastBefore(H[f],target,true);if(!p){p=H[f].find(x=>x.day<curDay)||null;if(p)fallback=true}if(p)prev[f]=p});
  const prevDays=['dg','fuel'].map(f=>prev[f]?.day).filter(Boolean);
  const prevDay=prevDays.length?prevDays.sort().pop():Object.values(prev).map(x=>x.day).sort().pop()||'';
  const fills=recsOf(sid,'diesel').filter(r=>prevDay&&dayOf(r.dt)>prevDay&&dayOf(r.dt)<=curDay&&+r.data.filled>0);
  const filled=r2(fills.reduce((s,r)=>s+(+r.data.filled||0),0));
  return {curDay,prevDay,target,fallback,filled,fills:fills.length,
    cur:Object.fromEntries(RF.map(([f])=>[f,cur[f]?{v:cur[f].v,src:cur[f].src}:{v:'',src:''}])),
    prev:Object.fromEntries(RF.map(([f])=>[f,prev[f]?{v:prev[f].v,src:prev[f].src}:{v:'',src:''}]))};
}
function reqCalc(R,sid){
  const SC=siteCfg(sid);
  const d=f=>isNum(R.cur[f].v)&&isNum(R.prev[f].v)?r2(R.cur[f].v-R.prev[f].v):'';
  const dg=d('dg');
  const fuelDiff=isNum(R.cur.fuel.v)&&isNum(R.prev.fuel.v)?r2(R.prev.fuel.v-R.cur.fuel.v):'';
  const cons=isNum(dg)?r2(Math.max(0,dg)*SC.rate):'';
  const tankUse=isNum(fuelDiff)?r2(fuelDiff+(+R.filled||0)):'';
  const tankFill=SC.tank&&isNum(R.cur.fuel.v)?r2(Math.max(0,SC.tank-R.cur.fuel.v)):'';
  let req=isNum(cons)&&isNum(R.cur.fuel.v)?r2(Math.max(0,cons-R.cur.fuel.v)):'';
  if(SC.method==='tank'&&isNum(tankFill))req=tankFill;
  else if(isNum(req)&&isNum(tankFill))req=Math.min(req,tankFill);
  return {kwh:d('kwh'),kvah:d('kvah'),dg,piu:d('piu'),fuelDiff,cons,tankUse,req,tankFill,rate:SC.rate,method:SC.method,tank:SC.tank};
}
function reqMessage(sid,R,C){
  const e=(o)=>o.src==='EST'?' (Est.)':'';
  const v=(o,dec=2)=>fmtN(o.v,dec)+e(o);
  const L=[];
  L.push(siteName(sid),'',`Current: ${fmtD(R.curDay)}`,`EB kWh: ${v(R.cur.kwh)}`,`EB kVAh: ${v(R.cur.kvah)}`,`DG HMR: ${v(R.cur.dg)}`,`PIU HMR: ${v(R.cur.piu)}`,`Fuel level: ${fmtN(R.cur.fuel.v,1)} Litres`,'',
    `Previous: ${fmtD(R.prevDay)}`,`EB kWh: ${v(R.prev.kwh)}`,`EB kVAh: ${v(R.prev.kvah)}`,`DG HMR: ${v(R.prev.dg)}`,`PIU HMR: ${v(R.prev.piu)}`,`Fuel level: ${fmtN(R.prev.fuel.v,1)} Litres`,'',
    'Consumption and Difference Summary',`EB kWh Consumption: ${fmtN(C.kwh)}`,`EB kVAh Consumption: ${fmtN(C.kvah)}`,`DG Running Hours: ${fmtN(C.dg)}`,`PIU Running Hours: ${fmtN(C.piu)}`,`Fuel Level Difference: ${fmtN(C.fuelDiff,1)} Litres`);
  if(+R.filled>0)L.push(`Diesel Filled in Period: ${fmtN(R.filled,1)} Litres`);
  L.push(`DG Diesel Consumption (${C.rate} L/Hr): ${fmtN(C.cons,1)} Litres`,`Diesel Requirement: ${fmtN(C.req,1)} Litres`,'','Kindly arrange the required diesel filling.');
  return L.join('\n');
}
let MSG=null;
function RequestPage(sid){
  const site=siteById(sid);if(!site)return SiteList('request');
  const R=buildSnapshot(sid);
  if(!R){render(header('Diesel Request - '+site.name,'#/request')+`<div class="wrap"><div class="empty">No saved readings for ${esc(site.name)} yet.<br><br>Save a Diesel Filling record (and an Energy Reading for kVAh) first.</div><button class="btn b-g" onclick="location.hash='#/diesel/${sid}'">Go to Diesel Filling</button></div>`,'home');return}
  const box=(k,cls,title,day)=>`<div class="cbox ${cls}"><h4>${title}</h4><div class="d"><input type="date" id="d-${k}" value="${day||''}" style="border:0;background:transparent;font:inherit;font-weight:800;width:100%;padding:0"></div>
    ${RF.map(([f,l])=>`<div class="kv"><span>${l}${f==='fuel'?' (L)':''}</span><input type="number" step="any" inputmode="decimal" data-rk="${k}" data-rf="${f}" value="${isNum(R[k][f].v)?R[k][f].v:''}" class="${!isNum(R[k][f].v)?'miss':R[k][f].src==='EST'?'est':''}" placeholder="needed"></div>`).join('')}</div>`;
  render(header('Diesel Request - '+site.name,'#/request')+`<div class="wrap">
    <div id="missing"></div>
    ${R.fallback?`<div class="note">No reading found 30 days back (on/before ${fmtD(R.target)}). Using the oldest available earlier reading instead.</div>`:''}
    <div class="cmp">${box('cur','c','Current Reading',R.curDay)}${box('prev','p','Previous Reading',R.prevDay)}</div>
    <div class="field"><div class="lbl">Diesel filled between these dates (L)</div><input class="inp sm" id="r-filled" type="number" step="any" inputmode="decimal" value="${R.filled}"><div class="hint">${R.fills} filling record(s) found in Diesel Filling history. Edit only if a filling was not recorded.</div></div>
    <div class="sum" id="sum"></div>
    <button class="btn b-o" id="gen">${I.wa}Generate Message</button>
  </div>`,'home');
  function upd(){
    const C=reqCalc(R,sid);
    const miss=[];RF.forEach(([f,l])=>{if(!isNum(R.cur[f].v))miss.push('Current '+l);if(!isNum(R.prev[f].v))miss.push('Previous '+l)});
    if(!R.prevDay)miss.push('Previous date');
    $('#missing').innerHTML=miss.length?`<div class="warn">${I.alert}<span>Missing information: ${miss.join(', ')}. Please enter it in the red boxes below.</span></div>`:'';
    $('#sum').innerHTML=`<h4>Consumption and Difference</h4>
    <div class="l"><span>EB kWh Consumption</span><b>${fmtN(C.kwh)}</b></div>
    <div class="l"><span>EB kVAh Consumption</span><b>${fmtN(C.kvah)}</b></div>
    <div class="l"><span>DG Running Hours</span><b>${fmtN(C.dg)}</b></div>
    <div class="l"><span>PIU Running Hours</span><b>${fmtN(C.piu)}</b></div>
    <div class="l"><span>Fuel Level Difference</span><b>${fmtN(C.fuelDiff,1)} L</b></div>
    <div class="l"><span>Diesel Filled in Period</span><b>${fmtN(R.filled||0,1)} L</b></div>
    <div class="l"><span>DG Consumption (${C.rate} L/Hr)</span><b>${fmtN(C.cons,1)} L</b></div>
    ${isNum(C.tankUse)&&isNum(C.cons)&&Math.abs(C.tankUse-C.cons)>5?`<div class="l" style="color:var(--y)"><span>Tank-based use (prev + filled − current)</span><b>${fmtN(C.tankUse,1)} L</b></div>`:''}
    <div class="l req"><span>Diesel Requirement (Est.)</span><b>${fmtN(C.req,1)} L</b></div>
    ${C.tank?`<div class="l"><span>Tank capacity / space</span><b>${fmtN(C.tank)} L / ${fmtN(C.tankFill,1)} L</b></div>`:''}
    <div class="hint">${C.method==='tank'?`This site: requirement = fill tank to full (${C.tank} L) − current fuel.`:`Requirement = DG consumption for the period (${C.rate} L/Hr) − current fuel balance${C.tank?', limited to tank space':''}.`} <a href="javascript:editSite('${sid}',true)">Change site settings</a></div>`;
    $('#gen').disabled=!!miss.length;
    return C;
  }
  upd();
  $$('[data-rk]').forEach(el=>el.oninput=()=>{R[el.dataset.rk][el.dataset.rf]={v:isNum(el.value)?+el.value:'',src:'MANUAL'};el.classList.toggle('miss',!isNum(el.value));el.classList.remove('est');upd()});
  $('#d-cur').onchange=e=>{R.curDay=e.target.value;upd()};
  $('#d-prev').onchange=e=>{R.prevDay=e.target.value;upd()};
  $('#r-filled').oninput=e=>{R.filled=+e.target.value||0;upd()};
  $('#gen').onclick=async()=>{
    const C=upd();const text=reqMessage(sid,R,C);
    const rec={id:uid(),type:'request',site:sid,siteName:site.name,dt:nowLocal(),user:S.user,phone:S.phone,email:ACCOUNT?ACCOUNT.email:'',createdAt:Date.now(),deleted:false,
      data:{curDay:R.curDay,prevDay:R.prevDay,cur:R.cur,prev:R.prev,filled:R.filled,calc:C,requirement:C.req,message:text},src:{}};
    await putRec(rec);
    MSG={sid,text,recId:rec.id};location.hash='#/msg';
  };
}

    </div>

    <button class="btn b-gr" style="flex:none;padding:8px 12px;font-size:13px" onclick="exportExcel(filtered())">${I.xls}Export Excel</button></div>
    ${list.slice(0,300).map(r=>`<button class="rec" data-id="${r.id}"><span class="tg tg-${r.type}">${r.type.toUpperCase()}</span><span class="mid"><b>${esc(siteName(r.site))}</b><small>${fmtDT(r.dt)}${r.user?' · '+esc(r.user):''}${Object.values(r.src||{}).includes('EST')?' · has estimate':''}</small></span><span class="rt">${right(r)}</span></button>`).join('')||'<div class="empty">No records match the filter.</div>'}
  </div>`,'history');
  const re=()=>{HF.site=$('#hs').value;HF.type=$('#ht').value;HF.from=$('#hf').value;HF.to=$('#hto').value;History()};
  ['#hs','#ht','#hf','#hto'].forEach(s=>$(s).onchange=re);
  $$('.rec').forEach(b=>b.onclick=()=>recDetail(b.dataset.id));
}
function recDetail(id){
  const r=RECS.find(x=>x.id===id);if(!r)return;
  const s=k=>{const v=(r.src||{})[k];return v&&v!=='MANUAL'?` <span class="badge bd-${v}">${v==='EST'?'EST':v}</span>`:''};
  let body='';
  if(r.type==='diesel'){const d=r.data;body=`<span>EB kWh</span><b>${fmtN(d.kwh)}${s('kwh')}</b><span>DG HMR</span><b>${fmtN(d.dg)}${s('dg')}</b><span>PIU HMR</span><b>${fmtN(d.piu)}${s('piu')}</b><span>Prev DG / date</span><b>${d.prev?fmtN(d.prev.dg)+' · '+fmtD(d.prev.dt):'—'}</b><span>Opening</span><b>${fmtN(d.opening,1)} L</b><span>Filled</span><b>${fmtN(d.filled,1)} L</b><span>DG hrs diff</span><b>${fmtN(d.dgDiff)}</b><span>Consumption</span><b>${fmtN(d.consumption,1)} L</b><span>Closing</span><b>${fmtN(d.closing,1)} L</b>`}
  else if(r.type==='energy'){const d=r.data;body=`<span>EB kWh</span><b>${fmtN(d.kwh)}${s('kwh')}</b><span>EB kVAh</span><b>${fmtN(d.kvah)}${s('kvah')}</b>`+OPS.map(o=>{const c=d.ops?.[o];if(!c||!CHS.some(x=>isNum(c[x]?.kw)||isNum(c[x]?.amp)))return '';return `<span style="grid-column:1/3;font-weight:800;color:var(--t);margin-top:6px">${o}</span>`+CHS.map(x=>`<span>CH${x} kW / Amp</span><b>${fmtN(c[x]?.kw)}${s(`${o}.${x}.kw`)} / ${fmtN(c[x]?.amp)}${s(`${o}.${x}.amp`)}</b>`).join('')}).join('')}
  else body=`<span style="grid-column:1/3"></span></div><textarea class="msg" style="min-height:260px" readonly>${esc(r.data.message)}</textarea><div>`;
  modal(`<h3>${esc(siteName(r.site))} · ${r.type}</h3><div class="dl"><span>Date</span><b>${fmtDT(r.dt)}</b><span>Entered by</span><b>${esc(r.user||'—')}</b>${body}</div>
  <div class="btns">${r.type==='request'?`<button class="btn b-wa" id="rwa">${I.wa}Resend</button>`:''}<button class="btn b-r" id="del">Delete</button><button class="btn b-gr" onclick="closeModal()">Close</button></div>`);
  $('#del').onclick=async()=>{if(!confirm('Delete this record? It will be removed from all devices.'))return;r.deleted=true;await putRec(r);closeModal();toast('Record deleted');History()};
  if($('#rwa'))$('#rwa').onclick=()=>window.open(`https://wa.me/${(siteCfg(r.site).wa||'').replace(/\D/g,'')}?text=${encodeURIComponent(r.data.message)}`,'_blank');
}

/* ================= EXCEL EXPORT ================= */
async function exportExcel(list){
  list=list||live();
  toast('Preparing Excel…',4000);
  try{await loadScript(CDN.xlsx)}catch(e){return toast(e.message)}
  const by=t=>list.filter(r=>r.type===t).sort((a,b)=>a.dt<b.dt?-1:1);
  const dt=r=>[fmtD(r.dt),r.dt.slice(11,16)];
  const wb=XLSX.utils.book_new();
  const add=(name,head,rows)=>{const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=head.map(h=>({wch:Math.max(10,String(h).length+2)}));XLSX.utils.book_append_sheet(wb,ws,name)};
  const n=v=>isNum(v)?+v:'';
  add('Diesel Filling Records',['Record ID','Date','Time','Site','EB kWh','kWh Source','DG HMR','DG Source','PIU HMR','PIU Source','Prev Date','Prev kWh','Prev DG HMR','Prev PIU HMR','Opening (L)','Filled (L)','DG Hrs Diff','Consumption (L)','Closing (L)','Rate L/Hr','User','Phone','Email'],
    by('diesel').map(r=>{const d=r.data;return [r.id,...dt(r),siteName(r.site),n(d.kwh),r.src?.kwh||'',n(d.dg),r.src?.dg||'',n(d.piu),r.src?.piu||'',d.prev?fmtD(d.prev.dt):'',d.prevKwh?d.prevKwh.v:'',d.prev?n(d.prev.dg):'',d.prev?n(d.prev.piu):'',n(d.opening),n(d.filled),n(d.dgDiff),n(d.consumption),n(d.closing),n(d.rate),r.user||'',r.phone||'',r.email||'']}));
  add('Energy Readings',['Record ID','Date','Time','Site','EB kWh','kWh Source','EB kVAh','kVAh Source','Prev kWh','Prev kVAh','kWh Diff','kVAh Diff','User'],
    by('energy').map(r=>{const d=r.data;return [r.id,...dt(r),siteName(r.site),n(d.kwh),r.src?.kwh||'',n(d.kvah),r.src?.kvah||'',d.prevKwh?.v??'',d.prevKvah?.v??'',isNum(d.kwh)&&d.prevKwh?r2(d.kwh-d.prevKwh.v):'',isNum(d.kvah)&&d.prevKvah?r2(d.kvah-d.prevKvah.v):'',r.user||'']}));
  OPS.forEach(o=>add(o+' Records',['Record ID','Date','Time','Site','Channel','kW','kW Source','Amp','Amp Source','User'],
    by('energy').flatMap(r=>CHS.map(c=>{const v=r.data.ops?.[o]?.[c];if(!v||(!isNum(v.kw)&&!isNum(v.amp)))return null;return [r.id,...dt(r),siteName(r.site),'CH'+c,n(v.kw),r.src?.[`${o}.${c}.kw`]||'',n(v.amp),r.src?.[`${o}.${c}.amp`]||'',r.user||'']}).filter(Boolean))));
  add('Diesel Request History',['Record ID','Date','Time','Site','Current Date','Previous Date','kWh Cons','kVAh Cons','DG Hrs','PIU Hrs','Fuel Diff (L)','Filled (L)','DG Consumption (L)','Requirement (L)','Message','User'],
    by('request').map(r=>{const d=r.data,c=d.calc||{};return [r.id,...dt(r),siteName(r.site),fmtD(d.curDay),fmtD(d.prevDay),n(c.kwh),n(c.kvah),n(c.dg),n(c.piu),n(c.fuelDiff),n(d.filled),n(c.cons),n(c.req),d.message,r.user||'']}));
  add('Site Master',['No','Site ID','Site Name','Active','Operators','Channels per Operator','DG Rate (L/Hr)','Opening Default (L)','Tank Capacity (L)','Low Fuel Alert (L)','Requirement Method','WhatsApp'],S.sites.map((s,i)=>{const c=siteCfg(s.id);return [i+1,s.id,s.name,s.hidden?'No':'Yes',c.ops.join(', '),4,c.rate,c.opening,c.tank||'',c.low,c.method==='tank'?'Fill tank to full':'DG consumption',c.wa]}));
  add('Previous Readings',['Site','Fuel (L)','Fuel Date','DG HMR','DG Date','EB kWh','kWh Date','EB kVAh','kVAh Date'],latestBySite().map(x=>[x.s.name,x.fuel?.v??'',x.fuel?fmtD(x.fuel.dt):'',x.dg?.v??'',x.dg?fmtD(x.dg.dt):'',x.kwh?.v??'',x.kwh?fmtD(x.kwh.dt):'',x.kvah?.v??'',x.kvah?fmtD(x.kvah.dt):'']));
  XLSX.writeFile(wb,`FieldRecord_${dayOf(nowLocal())}.xlsx`);
}

/* ================= SITE EDITOR ================= */
function editSite(sid,back){
  const st=siteById(sid);if(!st)return;const c=siteCfg(sid);
  const v=k=>st[k]!==undefined&&st[k]!==null?st[k]:'';
  modal(`<h3>Site Settings · ${esc(st.name)}</h3>
  <div class="setf"><label>Site name</label><input class="sel" id="e-name" value="${esc(st.name)}"></div>
  <div class="g2">
    <div class="setf"><label>DG rate (L/Hr)</label><input class="sel" id="e-rate" type="number" step="0.1" inputmode="decimal" value="${v('rate')}" placeholder="${S.rate} (default)"></div>
    <div class="setf"><label>Opening balance (L)</label><input class="sel" id="e-opening" type="number" inputmode="decimal" value="${v('opening')}" placeholder="${S.openingDefault} (default)"></div>
    <div class="setf"><label>Tank capacity (L)</label><input class="sel" id="e-tank" type="number" inputmode="decimal" value="${v('tank')}" placeholder="optional"></div>
    <div class="setf"><label>Low fuel alert (L)</label><input class="sel" id="e-low" type="number" inputmode="decimal" value="${v('low')}" placeholder="${S.lowFuel} (default)"></div>
  </div>
  <div class="setf"><label>Diesel requirement method</label><select class="sel" id="e-method">
    <option value="consumption" ${c.method==='consumption'?'selected':''}>DG consumption − current fuel (default)</option>
    <option value="tank" ${c.method==='tank'?'selected':''}>Fill tank to full (needs tank capacity)</option></select></div>
  <div class="setf"><label>Operators at this site</label><div class="opts" id="e-ops">${OPS.map(o=>`<button type="button" data-op="${o}" class="${c.ops.includes(o)?'on':''}">${o}</button>`).join('')}</div></div>
  <div class="setf"><label>WhatsApp number for this site's requests (optional)</label><input class="sel" id="e-wa" inputmode="tel" value="${esc(st.wa||'')}" placeholder="${esc(S.waNumber||'e.g. 919876543210')}"></div>
  <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 4px"><input type="checkbox" id="e-hidden" ${st.hidden?'checked':''} style="width:20px;height:20px"> Hide this site from lists (records are kept)</label>
  <div class="hint">Leave a box empty to use the default value from Settings.</div>
  <div class="btns"><button class="btn b-gr" onclick="closeModal()">Cancel</button><button class="btn b-g" id="e-save">${I.save}Save</button></div>`);
  $$('#e-ops [data-op]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  $('#e-save').onclick=async()=>{
    const num=id=>{const x=$(id).value.trim();return x===''?undefined:+x};
    const ops=$$('#e-ops .on').map(b=>b.dataset.op);
    if(!ops.length)return toast('Select at least one operator');
    const name=$('#e-name').value.trim();if(!name)return toast('Enter a site name');
    const method=$('#e-method').value,tank=num('#e-tank');
    if(method==='tank'&&!tank)return toast('Enter tank capacity for "Fill tank to full"');
    Object.assign(st,{name,rate:num('#e-rate'),opening:num('#e-opening'),tank,low:num('#e-low'),method:method==='consumption'?undefined:method,ops:ops.length===OPS.length?undefined:ops,wa:$('#e-wa').value.trim()||undefined,hidden:$('#e-hidden').checked||undefined});
    Object.keys(st).forEach(k=>st[k]===undefined&&delete st[k]);
    await saveSiteConfig();closeModal();toast('Site settings saved');back?route():Settings();
  };
}

/* ================= SETTINGS ================= */
function Settings(){
  render(header('Settings','')+`<div class="wrap">
    ${S.firebase?`<div class="card" style="display:flex;align-items:center;gap:12px">${ACCOUNT&&ACCOUNT.photo?`<img src="${esc(ACCOUNT.photo)}" referrerpolicy="no-referrer" style="width:44px;height:44px;border-radius:50%">`:''}<div style="flex:1;min-width:0"><b>${esc(ACCOUNT?ACCOUNT.name:'Not signed in')}</b><div class="hint" style="margin:0;overflow:hidden;text-overflow:ellipsis">${esc(ACCOUNT?ACCOUNT.email:'')}</div></div><button class="btn b-r" style="flex:none;padding:10px 14px;font-size:14px" id="s-out">Sign out</button></div>`:''}
    <div class="card"><h3>User</h3>
      <div class="setf"><label>Your name (saved with every record)</label><input class="sel" id="s-user" value="${esc(S.user)}"></div>
      <div class="setf"><label>Phone</label><input class="sel" id="s-phone" inputmode="tel" value="${esc(S.phone)}"></div>
      <div class="setf"><label>Default WhatsApp number for requests (optional, with country code e.g. 919876543210)</label><input class="sel" id="s-wa" inputmode="tel" value="${esc(S.waNumber)}"></div></div>
    <div class="card"><h3>Default values (all sites)</h3>
      <div class="hint" style="margin:0 0 8px">Used for any site that doesn't have its own value in Site Settings.</div>
      <div class="g2"><div class="setf"><label>Opening balance (L)</label><input class="sel" id="s-open" type="number" value="${S.openingDefault}"></div>
      <div class="setf"><label>DG rate (L/Hr)</label><input class="sel" id="s-rate" type="number" step="0.1" value="${S.rate}"></div>
      <div class="setf"><label>Low fuel alert (L)</label><input class="sel" id="s-low" type="number" value="${S.lowFuel}"></div></div></div>
    <button class="btn b-g" id="s-save" style="width:100%">${I.save}Save Settings</button>
    <div class="card mt"><h3>Site Settings (${activeSites().length} sites)</h3>
      <div class="hint" style="margin:0 0 8px">Tap a site to set its own DG rate, opening balance, tank capacity, low-fuel alert, requirement method, operators and WhatsApp number. Changes sync to all phones.</div>
      <ul class="slist" style="margin:0 -14px">${S.sites.map((st,i)=>{const c=siteCfg(st.id),own=['rate','opening','tank','low','method','ops','wa'].some(k=>st[k]!==undefined&&st[k]!==null&&st[k]!=='');
        return `<li><a href="javascript:editSite('${st.id}')"><span class="num" style="${st.hidden?'background:#aab4ae':''}">${i+1}</span><span class="nm"><b>${esc(st.name)}${st.hidden?' (hidden)':''}</b><small>${c.rate} L/Hr · Open ${c.opening} L${c.tank?' · Tank '+c.tank+' L':''} · ${c.ops.length} operators${own?' · custom':''}</small></span><span class="ar">${I.chev}</span></a></li>`}).join('')}</ul>
      <button class="btn b-gr mt" style="width:100%" id="s-add">+ Add new site</button></div>
    <div class="card mt"><h3>Cloud Sync (Firebase)</h3>
      <div class="hint" style="margin:0 0 8px">Paste the <b>firebaseConfig</b> object from Firebase console → Project settings → Your apps → Web app. All phones using the same config share records.</div>
      <textarea class="sel" id="s-fb" rows="7" style="font-size:12px;font-family:monospace" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }'>${S.firebase?esc(JSON.stringify(S.firebase,null,1)):''}</textarea>
      <div class="hint" id="s-fbst">${S.firebase?(Sync.ready?'Connected ✓':Sync.err?'Error: '+esc(Sync.err):'Connecting…'):'Not connected — records stay on this phone only.'}</div>
      <div class="btns"><button class="btn b-g" id="s-fbsave">Connect</button><button class="btn b-gr" id="s-sync">${I.sync}Sync now</button></div>
      ${S.firebase?`<div class="btns"><button class="btn b-gr" id="s-full" style="font-size:13px">Full resync</button><button class="btn b-r" id="s-fboff" style="font-size:13px">Disconnect</button></div>`:''}</div>
    <div class="card"><h3>Data</h3>
      <div class="btns"><button class="btn b-gr" onclick="exportExcel()">${I.xls}Excel (all)</button><button class="btn b-gr" id="s-json">Backup JSON</button></div>
      <div class="btns"><button class="btn b-gr" id="s-imp">Restore JSON</button><button class="btn b-gr" id="s-sample">Load sample data</button></div>
      <input type="file" id="s-impf" accept=".json" hidden>
      <div class="hint mt">${live().length} records on this phone · ${PENDING.size} waiting to sync</div></div>
    <div class="card"><h3>About</h3>
      <div class="dl" style="margin:0"><span>App</span><b>Field Record</b><span>Version</span><b>1.1</b><span>Developer</span><b>Manu Brahma</b></div>
      <div class="note mt" style="margin-bottom:0"><b>Disclaimer:</b> Diesel consumption, requirement and estimated readings are calculated values. Always verify against actual meter and tank readings before submitting a diesel request. Values marked ESTIMATE / (Est.) are not actual meter readings.</div></div>
    ${footer(true)}
  </div>`,'settings');
  if($('#s-out'))$('#s-out').onclick=()=>{if(PENDING.size&&!confirm(PENDING.size+' record(s) not yet uploaded. Sign out anyway? (They stay on this phone.)'))return;if(confirm('Sign out of Field Record?'))Sync.logout()};
  $('#s-save').onclick=()=>{
    S.user=$('#s-user').value.trim();S.phone=$('#s-phone').value.trim();S.waNumber=$('#s-wa').value.trim();
    S.openingDefault=+$('#s-open').value||60;S.rate=+$('#s-rate').value||3.5;S.lowFuel=+$('#s-low').value||30;
    saveS();toast('Settings saved');Settings();
  };
  $('#s-add').onclick=async()=>{const nm=(prompt('New site name')||'').trim();if(!nm)return;const id='s'+Date.now().toString(36);S.sites.push({id,name:nm});await saveSiteConfig();toast('Site added');Settings();editSite(id)};
  $('#s-fbsave').onclick=async()=>{
    let t=$('#s-fb').value.trim();if(!t)return toast('Paste the config first');
    try{const m=t.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})/);if(m)t=m[1];t=t.replace(/^[^{]*/,'').replace(/[^}]*$/,'');const cfg=Function('"use strict";return ('+t+')')();if(!cfg.apiKey||!cfg.projectId)throw 0;S.firebase=cfg;saveS();localStorage.removeItem('fr_fb_off');$('#s-fbst').textContent='Connecting…';await Sync.init();Settings()}
    catch(e){toast('Invalid config – copy the { … } block exactly')}
  };
  $('#s-sync').onclick=async()=>{if(!S.firebase)return toast('Connect Firebase first');Sync.ready?await Sync.push():await Sync.init();toast(Sync.err?'Sync error: '+Sync.err:'Sync complete')};
  if($('#s-full'))$('#s-full').onclick=async()=>{await Sync.fullResync();toast('Full resync started')};
  if($('#s-fboff'))$('#s-fboff').onclick=()=>{if(!confirm('Disconnect cloud sync on this phone? Local records are kept.'))return;S.firebase=null;saveS();localStorage.setItem('fr_fb_off','1');location.reload()};
  $('#s-json').onclick=()=>{const b=new Blob([JSON.stringify({settings:S,records:RECS},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`FieldRecord_backup_${dayOf(nowLocal())}.json`;a.click()};
  $('#s-imp').onclick=()=>$('#s-impf').click();
  $('#s-impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());let n=0;for(const r of (j.records||[])){const loc=RECS.find(x=>x.id===r.id);if(!loc||(loc.updatedAt||0)<(r.updatedAt||0)){await DB.put(r);loc?Object.assign(loc,r):RECS.push(r);PENDING.add(r.id);n++}}savePending();Sync.push();toast(n+' records restored');Settings()}catch(err){toast('Invalid backup file')}};
  $('#s-sample').onclick=async()=>{if(!confirm('Add sample test records for Palliyadi (26/09/2026 – 29/10/2026)?'))return;await loadSample();toast('Sample data added – try Diesel Request › Palliyadi')};
}
async function loadSample(){
  const sid='s1',nm=siteName(sid);
  const mk=(id,type,dt,data,src)=>({id,type,site:sid,siteName:nm,dt,user:'Sample',phone:'',createdAt:Date.now(),deleted:false,data,src});
  const rate=3.5;
  const recs=[
    mk('sample-d1','diesel','2026-09-26T10:00',{kwh:71657,dg:1084,piu:970,opening:60,filled:14,dgDiff:0,consumption:0,closing:74,rate,prev:null},{kwh:'MANUAL',dg:'MANUAL',piu:'MANUAL'}),
    mk('sample-e1','energy','2026-09-26T10:05',{kwh:71657,kvah:72196,ops:sampleOps(0)},{kwh:'MANUAL',kvah:'MANUAL'}),
    mk('sample-d2','diesel','2026-10-14T11:00',{kwh:74950,dg:1095,piu:981,opening:74,filled:0,dgDiff:11,consumption:38.5,closing:35.5,rate,prev:{dt:'2026-09-26T10:00',dg:1084,piu:970,closing:74}},{kwh:'MANUAL',dg:'MANUAL',piu:'MANUAL'}),
    mk('sample-d3','diesel','2026-10-29T09:30',{kwh:78031,dg:1107,piu:993,opening:35.5,filled:44.5,dgDiff:12,consumption:42,closing:38,rate,prev:{dt:'2026-10-14T11:00',dg:1095,piu:981,closing:35.5}},{kwh:'MANUAL',dg:'MANUAL',piu:'MANUAL'}),
    mk('sample-e2','energy','2026-10-29T09:40',{kwh:78031,kvah:78624,ops:sampleOps(1)},{kwh:'MANUAL',kvah:'MANUAL'})
  ];
  for(const r of recs)await putRec(r);
}
function sampleOps(k){const base={Airtel:[12.5,22],Vodafone:[10,18],BSNL:[11.2,20],Jio:[9.8,17.5]};const o={};OPS.forEach(op=>{o[op]={};CHS.forEach(c=>{const [kw,a]=base[op];o[op][c]={kw:r2(kw-c*.4+k*.3),amp:r2(a-c*.6+k*.5)}})});return o}

  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

})();
